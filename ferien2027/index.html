<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ferien 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Gloock&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F9;--card:#FFF;--ink:#17213A;--muted:#5B667D;--line:#D6DDE8;--lake:#24507E;--gold:#B5822A;--gold-soft:#F6EBD6;--ok:#2E7D4F;--ok-soft:#E3F2E8;--warn:#A4521B;--warn-soft:#FBE9DC}
@media (prefers-color-scheme:dark){:root{--bg:#0F1524;--card:#18213A;--ink:#E8ECF4;--muted:#9AA5BC;--line:#2B3654;--lake:#7FA8D6;--gold:#D9A954;--gold-soft:#3A2F1A;--ok:#7CCB9A;--ok-soft:#18332A;--warn:#E8A070;--warn-soft:#3A2618}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Gloock,Georgia,serif;font-weight:400;line-height:1.15;margin:0}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 64px}
/* lock */
#lock{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-card{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:30px 22px;border-radius:16px;background:var(--card);border:1px solid var(--gold)}
.lock-card h1{font-size:clamp(36px,10vw,46px)}
.lock-card p{margin:0;color:var(--muted)}
#pin{width:100%;font:inherit;font-size:28px;letter-spacing:.5em;text-align:center;padding:12px 0 12px .5em;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
#pin:focus{outline:2px solid var(--lake);outline-offset:1px}
button{font:inherit;font-size:16px;font-weight:600;border-radius:10px;padding:11px 16px;cursor:pointer;border:1px solid var(--lake);background:var(--lake);color:var(--bg);width:100%}
button:disabled{opacity:.6;cursor:wait}
#err{color:var(--warn);min-height:1.5em;font-size:14px}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* content */
.wrap{max-width:720px;padding:14px 14px 56px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:4px 2px 12px}
.ey{margin:0;color:var(--gold);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.top h1{font-size:30px}
.sub{margin:0;color:var(--muted);font-size:12px;text-align:right;max-width:150px;line-height:1.35}
.tabs{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:4px;margin:0 -4px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 14px rgba(23,33,58,.07)}
.tabs button{width:auto;background:transparent;color:var(--muted);border:0;border-radius:10px;padding:7px 2px;font-size:18px;line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:12px;font-weight:600}
.tabs button[aria-selected=true]{background:var(--lake);color:var(--bg)}
.panel[hidden]{display:none}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{width:auto;flex:0 0 auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.legend{font-size:12px;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.lg{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:6px}.lg:first-child{margin-left:0}
.lg.ok{background:var(--ok)}.lg.warn{background:var(--warn)}
.grp{margin-bottom:14px}
.grp[hidden]{display:none}
.grp h2{font-family:Figtree,sans-serif;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 2px 6px}
.grp h2 small{font-weight:600;text-transform:none;letter-spacing:0;color:var(--gold);margin-left:4px;font-size:13px}
.d{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:6px 0;scroll-margin-top:86px;overflow:hidden}
.d[open]{border-color:var(--lake);box-shadow:0 6px 20px rgba(23,33,58,.08)}
.d summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:11px 12px}
.d summary::-webkit-details-marker{display:none}
.df{font-size:24px;line-height:1}
.dm{min-width:0}
.dm b{display:block;font-size:16px;font-weight:700}
.dm small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}.dm small.dt{color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.rc{font-size:11px;font-weight:700;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.dp{text-align:right;line-height:1.1;display:flex;flex-direction:column;align-items:flex-end}
.dp b{font-size:18px;font-variant-numeric:tabular-nums}
.dp small{font-size:11px;color:var(--muted)}
.dp.ok b{color:var(--ok)}.dp.warn b{color:var(--warn)}.dp.city b{color:var(--ink)}
.d summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);grid-column:3;justify-self:end;display:none}
.db{padding:0 12px 12px;border-top:1px solid var(--line)}
.fl{display:flex;gap:8px;font-size:13.5px;margin-top:10px;background:var(--bg);border-radius:10px;padding:8px 10px;line-height:1.4}
.fl span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.fl a{color:var(--lake);font-weight:600}
.fx{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.fx b{color:var(--ink);font-weight:600;margin-right:4px}
.hs{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:8px}
.h{border:1px solid var(--line);border-radius:12px;padding:10px 11px}
.h1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hnm{font-weight:700;font-size:15px;line-height:1.3}
.hp{text-align:right;white-space:nowrap;line-height:1.1}
.hp b{font-size:16px;font-variant-numeric:tabular-nums;color:var(--ok)}
.h.over .hp b{color:var(--warn)}
.panel[data-panel=stadt] .hp b{color:var(--ink)}
.hp small{display:block;font-size:10.5px;color:var(--muted)}
.h2{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:6px}
.rt{background:var(--lake);color:var(--bg);font-weight:700;font-size:12px;border-radius:6px 6px 6px 0;padding:1px 6px}
.st{font-size:12px;color:var(--gold);font-weight:700}
.b{font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px}
.b.ai{background:var(--ok-soft);color:var(--ok)}.b.bf{background:var(--gold-soft);color:var(--gold)}
.hh{font-size:11.5px;color:var(--muted);margin-left:auto}
.hn2{margin:6px 0 0;font-size:13px;color:var(--muted);line-height:1.4}
.hf{margin:6px 0 0;font-size:12.5px;line-height:1.4;background:var(--bg);border-radius:8px;padding:6px 8px;color:var(--muted)}
.hl{display:flex;gap:6px;margin-top:8px}
.hl a{flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--lake);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:5px 0}
.hl a:active{background:var(--bg)}
.tn{margin:10px 2px 0;font-size:13px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0 2px 10px}
.pgrp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.pgrp h3{font-family:Figtree,sans-serif;font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;margin:2px 0 6px}
.pgrp h3 span{font-size:11px;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:2px 8px}
.po{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.po-l b{display:block;font-size:15px}
.po-l span{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.po-l small{display:block;font-size:12px;color:var(--muted)}
.po-r{text-align:right;line-height:1.15;white-space:nowrap}
.po-r b{font-size:20px}.po-r span{font-size:11px;color:var(--muted);margin-left:3px}
.po-r em{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.ic{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:10px}
.ic summary{cursor:pointer;font-weight:700;padding:12px 0;list-style:none}
.ic summary::-webkit-details-marker{display:none}
.ic ul{margin:0 0 12px;padding-left:18px;font-size:14px}.ic li{margin:5px 0}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}
.foot a{color:var(--lake)}
</style>
</head>
<body>
<div id="lock">
  <form class="lock-card" id="f" autocomplete="off">
    <h1>Ferien 2027</h1>
    <p>Bitte PIN eingeben</p>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" aria-label="PIN" autofocus>
    <button id="go" type="submit">Öffnen</button>
    <div id="err" role="alert"></div>
  </form>
</div>
<main class="wrap" id="app" hidden></main>

  go.disabled=true;err.textContent="";
  try{const h=await unlock(v);try{sessionStorage.setItem(KEY,v)}catch(_){}show(h)}
  catch(_){if(!silent){err.textContent="Falscher PIN";f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");pin.value="";pin.focus()}try{sessionStorage.removeItem(KEY)}catch(_){}}
  finally{go.disabled=false}
}
f.onsubmit=e=>{e.preventDefault();if(pin.value)tryPin(pin.value)};
pin.oninput=()=>{pin.value=pin.value.replace(/\D/g,"");if(pin.value.length===4)tryPin(pin.value)};
let saved=null;try{saved=sessionStorage.getItem(KEY)}catch(_){}
if(saved)tryPin(saved,true);
</script>
