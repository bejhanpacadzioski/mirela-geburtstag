<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ferien 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Gloock&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F9;--card:#FFF;--ink:#17213A;--muted:#5B667D;--line:#D6DDE8;--lake:#24507E;--gold:#B5822A;--gold-soft:#F6EBD6;--ok:#2E7D4F;--ok-soft:#E3F2E8;--warn:#A4521B;--warn-soft:#FBE9DC}
@media (prefers-color-scheme:dark){:root{--bg:#0F1524;--card:#18213A;--ink:#E8ECF4;--muted:#9AA5BC;--line:#2B3654;--lake:#7FA8D6;--gold:#D9A954;--gold-soft:#3A2F1A;--ok:#7CCB9A;--ok-soft:#18332A;--warn:#E8A070;--warn-soft:#3A2618}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Gloock,Georgia,serif;font-weight:400;line-height:1.15;margin:0}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 64px}
/* lock */
#lock{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-card{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:30px 22px;border-radius:16px;background:var(--card);border:1px solid var(--gold)}
.lock-card h1{font-size:clamp(36px,10vw,46px)}
.lock-card p{margin:0;color:var(--muted)}
#pin{width:100%;font:inherit;font-size:28px;letter-spacing:.5em;text-align:center;padding:12px 0 12px .5em;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
#pin:focus{outline:2px solid var(--lake);outline-offset:1px}
button{font:inherit;font-size:16px;font-weight:600;border-radius:10px;padding:11px 16px;cursor:pointer;border:1px solid var(--lake);background:var(--lake);color:var(--bg);width:100%}
button:disabled{opacity:.6;cursor:wait}
#err{color:var(--warn);min-height:1.5em;font-size:14px}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* content */
.wrap{max-width:720px;padding:14px 14px 56px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:4px 2px 12px}
.ey{margin:0;color:var(--gold);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.top h1{font-size:30px}
.sub{margin:0;color:var(--muted);font-size:12px;text-align:right;max-width:150px;line-height:1.35}
.tabs{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:4px;margin:0 -4px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 14px rgba(23,33,58,.07)}
.tabs button{width:auto;background:transparent;color:var(--muted);border:0;border-radius:10px;padding:7px 2px;font-size:18px;line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:12px;font-weight:600}
.tabs button[aria-selected=true]{background:var(--lake);color:var(--bg)}
.panel[hidden]{display:none}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{width:auto;flex:0 0 auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.legend{font-size:12px;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.lg{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:6px}.lg:first-child{margin-left:0}
.lg.ok{background:var(--ok)}.lg.warn{background:var(--warn)}
.grp{margin-bottom:14px}
.grp[hidden]{display:none}
.grp h2{font-family:Figtree,sans-serif;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 2px 6px}
.grp h2 small{font-weight:600;text-transform:none;letter-spacing:0;color:var(--gold);margin-left:4px;font-size:13px}
.d{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:6px 0;scroll-margin-top:86px;overflow:hidden}
.d[open]{border-color:var(--lake);box-shadow:0 6px 20px rgba(23,33,58,.08)}
.d summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:11px 12px}
.d summary::-webkit-details-marker{display:none}
.df{font-size:24px;line-height:1}
.dm{min-width:0}
.dm b{display:block;font-size:16px;font-weight:700}
.dm small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}.dm small.dt{color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.rc{font-size:11px;font-weight:700;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.dp{text-align:right;line-height:1.1;display:flex;flex-direction:column;align-items:flex-end}
.dp b{font-size:18px;font-variant-numeric:tabular-nums}
.dp small{font-size:11px;color:var(--muted)}
.dp.ok b{color:var(--ok)}.dp.warn b{color:var(--warn)}.dp.city b{color:var(--ink)}
.d summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);grid-column:3;justify-self:end;display:none}
.db{padding:0 12px 12px;border-top:1px solid var(--line)}
.fl{display:flex;gap:8px;font-size:13.5px;margin-top:10px;background:var(--bg);border-radius:10px;padding:8px 10px;line-height:1.4}
.fl span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.fl a{color:var(--lake);font-weight:600}
.fx{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.fx b{color:var(--ink);font-weight:600;margin-right:4px}
.hs{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:8px}
.h{border:1px solid var(--line);border-radius:12px;padding:10px 11px}
.h1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hnm{font-weight:700;font-size:15px;line-height:1.3}
.hp{text-align:right;white-space:nowrap;line-height:1.1}
.hp b{font-size:16px;font-variant-numeric:tabular-nums;color:var(--ok)}
.h.over .hp b{color:var(--warn)}
.panel[data-panel=stadt] .hp b{color:var(--ink)}
.hp small{display:block;font-size:10.5px;color:var(--muted)}
.h2{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:6px}
.rt{background:var(--lake);color:var(--bg);font-weight:700;font-size:12px;border-radius:6px 6px 6px 0;padding:1px 6px}
.st{font-size:12px;color:var(--gold);font-weight:700}
.b{font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px}
.b.ai{background:var(--ok-soft);color:var(--ok)}.b.bf{background:var(--gold-soft);color:var(--gold)}
.hh{font-size:11.5px;color:var(--muted);margin-left:auto}
.hn2{margin:6px 0 0;font-size:13px;color:var(--muted);line-height:1.4}
.hf{margin:6px 0 0;font-size:12.5px;line-height:1.4;background:var(--bg);border-radius:8px;padding:6px 8px;color:var(--muted)}
.hl{display:flex;gap:6px;margin-top:8px}
.hl a{flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--lake);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:5px 0}
.hl a:active{background:var(--bg)}
.tn{margin:10px 2px 0;font-size:13px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0 2px 10px}
.pgrp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.pgrp h3{font-family:Figtree,sans-serif;font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;margin:2px 0 6px}
.pgrp h3 span{font-size:11px;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:2px 8px}
.po{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.po-l b{display:block;font-size:15px}
.po-l span{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.po-l small{display:block;font-size:12px;color:var(--muted)}
.po-r{text-align:right;line-height:1.15;white-space:nowrap}
.po-r b{font-size:20px}.po-r span{font-size:11px;color:var(--muted);margin-left:3px}
.po-r em{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.ic{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:10px}
.ic summary{cursor:pointer;font-weight:700;padding:12px 0;list-style:none}
.ic summary::-webkit-details-marker{display:none}
.ic ul{margin:0 0 12px;padding-left:18px;font-size:14px}.ic li{margin:5px 0}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}
.foot a{color:var(--lake)}

/* app additions */
.topr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.edbtn{width:auto;font-size:13px;padding:5px 11px;border-radius:999px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
body.edit .edbtn{background:var(--gold);border-color:var(--gold);color:#fff}
.ed{display:none}
body.edit .ed{display:flex}
.edrow{gap:6px;flex-wrap:wrap;margin-top:8px}
.edrow button,.addbtn{width:auto;font-size:13px;font-weight:600;padding:5px 10px;border-radius:9px;background:var(--bg);color:var(--lake);border:1px dashed var(--lake)}
.edrow button.del{color:var(--warn);border-color:var(--warn)}
.addbtn{width:100%;margin:6px 0;padding:9px;border-radius:12px}
body.edit .addbtn.ed{display:block}
.grp h2{display:flex;align-items:center;gap:6px}
.grp h2 .ed{margin-left:auto;gap:4px}
.grp h2 .ed button{width:auto;font-size:12px;padding:2px 8px;border-radius:8px;background:var(--card);color:var(--lake);border:1px solid var(--line);text-transform:none;letter-spacing:0}
.grp h2 .ed button.del{color:var(--warn)}
.pend{color:var(--muted)!important;font-size:13px!important}
.chk{font-size:11px;color:var(--muted);display:block;margin-top:3px}
.empty{color:var(--muted);font-size:13px;margin:8px 2px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(10,15,30,.45);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sh{background:var(--card);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:600px){#sheet{align-items:center}.sh{border-radius:18px}}
.sh h3{font-family:Figtree,sans-serif;font-weight:700;font-size:18px;margin:0 0 10px}
.sh label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:9px 0 3px}
.sh input,.sh select,.sh textarea{width:100%;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.sh textarea{min-height:64px;resize:vertical}
.sh .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sh .cb{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:500;margin-top:12px}
.sh .cb input{width:20px;height:20px}
.sh .hintx{font-size:12px;color:var(--muted);margin:4px 0 0}
.sh details{margin-top:10px}.sh details summary{font-size:13px;color:var(--lake);cursor:pointer}
.shb{display:flex;gap:8px;margin-top:16px}
.shb button.sec{background:var(--bg);color:var(--ink);border-color:var(--line)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast[hidden]{display:none}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-2px}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="lock">
  <form class="lock-card" id="f" autocomplete="off">
    <h1>Ferien 2027</h1>
    <p>Bitte PIN eingeben</p>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" aria-label="PIN" autofocus>
    <button id="go" type="submit">Öffnen</button>
    <div id="err" role="alert"></div>
  </form>
</div>
<main class="wrap" id="app" hidden></main>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<script>
const API = "https://cialuwwynrruydkcrkbe.supabase.co/functions/v1/ferien";
const KEY = "ferien2027-pin";
const ss = (k, v) => { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v) } catch (_) {} };
const sg = k => { try { return sessionStorage.getItem(k) } catch (_) { return null } };
let PIN = null, D = null, EDIT = false;

async function api(action, body = {}) {
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json", "x-pin": PIN }, body: JSON.stringify({ action, ...body }) });
  const j = await r.json().catch(() => ({ error: "Serverfehler" }));
  if (!r.ok) { const e = new Error(j.error || "Fehler"); e.status = r.status; throw e; }
  return j;
}

/* helpers */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const chf = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "'");
const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const dt = s => { if (!s) return ""; const d = new Date(s + "T12:00:00"); return `${WD[d.getDay()]} ${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}.`; };
const nights = t => t.date_from && t.date_to ? Math.round((Date.parse(t.date_to) - Date.parse(t.date_from)) / 864e5) : 0;
const dshort = iso => { if (!iso) return ""; const d = new Date(iso); return `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}.`; };
const budget = () => Number(D.settings.budget || 2000);
const hotelsOf = t => D.hotels.filter(h => h.trip_id === t.id).sort((a, b) => (a.total2 ?? 1e9) - (b.total2 ?? 1e9));
const pp = (h, t) => h.total2 == null ? null : Number(h.total2) / 2 + Number(t.flight_pp || 0);
function bkLink(h, t) {
  try {
    const u = new URL(h.booking_url);
    if (t.date_from && t.date_to) { u.searchParams.set("checkin", t.date_from); u.searchParams.set("checkout", t.date_to); }
    return u.toString();
  } catch (_) { return h.booking_url || "#"; }
}
function toast(m, ms = 3200) { const t = document.getElementById("toast"); t.innerHTML = m; t.hidden = false; clearTimeout(t._t); t._t = setTimeout(() => t.hidden = true, ms); }

/* render */
function hotelRow(h, t, isBeach) {
  const p = pp(h, t);
  const over = isBeach && p != null && p > budget();
  const ml = h.meal || "";
  const ai = /inclusive/i.test(ml);
  const mlh = ml ? `<span class="b ${ai ? "ai" : "bf"}">${ai ? "🍹" : "🍳"} ${esc(ml)}</span>` : "";
  const rat = h.rating ? `<span class="rt">${esc(h.rating)}</span>` : "";
  const price = p == null ? `<b class="pend">Preis offen</b>` : `<b>${chf(p)}</b><small>p.P. total</small>`;
  const info = h.total2 == null ? (h.price_info ? esc(h.price_info) : "") :
    `Hotel ${chf(h.total2 / 2)} p.P. · ${esc(h.src || "")}${h.price_checked_at ? " " + dshort(h.price_checked_at) : ""}`;
  return `<li class="h${over ? " over" : ""}" data-h="${h.id}">
  <div class="h1"><span class="hnm">${esc(h.name)}</span><span class="hp">${price}</span></div>
  <div class="h2">${rat}<span class="st">${esc(h.stars || "")}</span>${mlh}<span class="hh">${info}</span></div>
  ${h.note ? `<p class="hn2">${esc(h.note)}</p>` : ""}${h.food ? `<p class="hf">🍽️ ${esc(h.food)}</p>` : ""}
  ${h.src === "Google" && h.price_info ? `<p class="hn2" style="font-size:11.5px">Google-Treffer: ${esc(h.price_info)}</p>` : ""}
  <div class="hl"><a href="${esc(bkLink(h, t))}" target="_blank" rel="noopener">🛏️ Booking</a><a href="${esc(h.maps_url || "#")}" target="_blank" rel="noopener">📍 Karte</a></div>
  <div class="ed edrow"><button data-act="hedit" data-id="${h.id}">✏️ Bearbeiten</button><button data-act="hprice" data-id="${h.id}">🔄 Preis suchen</button><button class="del" data-act="hdel" data-id="${h.id}">🗑️ Löschen</button></div>
</li>`;
}

function card(t, isBeach) {
  const hs = hotelsOf(t);
  const prices = hs.map(h => pp(h, t)).filter(x => x != null);
  const lo = prices.length ? Math.min(...prices) : null;
  const cls = !isBeach ? "city" : lo == null ? "" : lo > budget() ? "warn" : "ok";
  const n = nights(t);
  const d1 = t.flight_out || t.date_from, d2 = t.flight_back || t.date_to;
  const dates = d1 ? `${dt(d1)} – ${dt(d2)}${n ? ` · ${n} Nächte` : ""}` : "Daten offen";
  const fp = t.flight_pp != null ? `Flug CHF ${chf(t.flight_pp)}${t.flight_pp_max ? "–" + chf(t.flight_pp_max) : ""} p.P. hin &amp; zurück` : "Flugpreis offen";
  const extras = (t.extras || []).map(([k, v]) => `<li><b>${esc(k)}</b> ${esc(v)}</li>`).join("");
  const fa = t.flight_auto ? `<span>${esc(t.flight_auto)}${t.flight_url ? ` · <a href="${esc(t.flight_url)}" target="_blank" rel="noopener">ansehen</a>` : ""}</span>` : "";
  return `<details class="d" id="t-${t.id}" data-t="${t.id}">
<summary>
  <span class="df">${esc(t.flag || "📍")}</span>
  <span class="dm"><b>${esc(t.title)}${t.reco ? '<span class="rc">★ Tipp</span>' : ""}</b><small>${esc(t.subtitle || "")}</small><small class="dt">${dates}</small></span>
  <span class="dp ${cls}">${lo == null ? '<small>Preis</small><b class="pend">offen</b>' : `<small>ab CHF</small><b>${chf(lo)}</b><small>p.P.</small>`}</span>
</summary>
<div class="db">
  <div class="fl">✈️ <div>${t.flight_info || ""}${fa}<span>${fp}</span></div></div>
  ${extras ? `<ul class="fx">${extras}</ul>` : ""}
  <div class="ed edrow"><button data-act="tedit" data-id="${t.id}">✏️ Reise bearbeiten</button><button data-act="fprice" data-id="${t.id}">✈️ Flugpreis suchen</button><button class="del" data-act="tdel" data-id="${t.id}">🗑️ Reise löschen</button></div>
  <ul class="hs">${hs.map(h => hotelRow(h, t, isBeach)).join("") || '<li class="empty">Noch keine Hotels</li>'}</ul>
  <button class="addbtn ed" data-act="hnew" data-id="${t.id}">＋ Hotel hinzufügen</button>
  ${t.note ? `<p class="tn">💡 ${esc(t.note)}</p>` : ""}
</div>
</details>`;
}

function group(r) {
  const isBeach = r.category === "strand";
  const ts = D.trips.filter(t => t.region_id === r.id).sort((a, b) => a.sort - b.sort);
  return `<div class="grp" data-region="${r.id}"><h2>${esc(r.name)} <small>${esc(r.sub || "")}</small>
  <span class="ed"><button data-act="redit" data-id="${r.id}">✏️ Bearbeiten</button><button class="del" data-act="rdel" data-id="${r.id}">🗑️ Löschen</button></span></h2>
  ${ts.map(t => card(t, isBeach)).join("") || '<p class="empty">Noch keine Reisen</p>'}
  <button class="addbtn ed" data-act="tnew" data-id="${r.id}">＋ Reise / Ort in ${esc(r.name)}</button></div>`;
}

function render() {
  const app = document.getElementById("app");
  const openId = app.querySelector("details.d[open]")?.dataset.t;
  const regs = D.regions.slice().sort((a, b) => a.sort - b.sort);
  const strand = regs.filter(r => r.category === "strand"), stadt = regs.filter(r => r.category === "stadt");
  const f = sg("ferien2027-f2") || "all";
  app.innerHTML = `
<header class="top">
  <div><p class="ey">Bejhan &amp; Mirela</p><h1>Ferien 2027</h1></div>
  <div class="topr"><p class="sub">Ab Zürich · Direktflüge · Rückflug Samstag</p><button class="edbtn" data-act="edit">${EDIT ? "✓ Fertig" : "✏️ Bearbeiten"}</button></div>
</header>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="strand">🏝️<span>Strand</span></button>
  <button role="tab" data-tab="stadt">🏙️<span>Stadt</span></button>
  <button role="tab" data-tab="plan">🗓️<span>Ferien</span></button>
  <button role="tab" data-tab="infos">ℹ️<span>Infos</span></button>
</nav>
<section class="panel" data-panel="strand">
  <div class="seg" role="group" aria-label="Region"><button data-f="all">Alle</button>${strand.map(r => `<button data-f="${r.id}">${esc(r.name)}</button>`).join("")}</div>
  <p class="legend">Preise p.P. inkl. Flug · <span class="lg ok"></span> im Budget (≤ CHF ${chf(budget())}) · <span class="lg warn"></span> darüber</p>
  ${strand.map(group).join("")}
  <button class="addbtn ed" data-act="rnew" data-cat="strand">＋ Neue Region / Land</button>
</section>
<section class="panel" data-panel="stadt">
  <p class="legend">Preise = Hotel + Flug pro Person</p>
  ${stadt.map(group).join("")}
  <button class="addbtn ed" data-act="rnew" data-cat="stadt">＋ Neue Kategorie</button>
</section>
<section class="panel" data-panel="plan">${D.settings.plan_html || ""}</section>
<section class="panel" data-panel="infos">${D.settings.infos_html || ""}
  ${D.has_key ? "" : '<p class="hint">⚠️ Automatische Preissuche noch nicht aktiv – SerpApi-Key fehlt.</p>'}</section>
<p class="foot">Live-Daten · <a href="#" data-act="lock">Sperren</a></p>`;
  const tabs = [...app.querySelectorAll("[data-tab]")], panels = [...app.querySelectorAll("[data-panel]")];
  const sel = t => { tabs.forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t)); panels.forEach(p => p.hidden = p.dataset.panel !== t); ss("ferien2027-tab", t); };
  tabs.forEach(b => b.onclick = () => { sel(b.dataset.tab); window.scrollTo({ top: 0, behavior: "smooth" }); });
  const segs = [...app.querySelectorAll("[data-f]")], grps = [...app.querySelectorAll('[data-panel=strand] .grp')];
  const filt = f => { if (!segs.some(b => b.dataset.f === f)) f = "all"; segs.forEach(b => b.setAttribute("aria-pressed", b.dataset.f === f)); grps.forEach(g => g.hidden = !(f === "all" || g.dataset.region === f)); ss("ferien2027-f2", f); };
  segs.forEach(b => b.onclick = () => filt(b.dataset.f));
  const ds = [...app.querySelectorAll("details.d")];
  ds.forEach(d => d.addEventListener("toggle", () => { if (d.open && !d._quiet) { ds.forEach(o => { if (o !== d) o.open = false }); setTimeout(() => d.scrollIntoView({ behavior: "smooth", block: "start" }), 30); } d._quiet = false; }));
  sel(sg("ferien2027-tab") || "strand"); filt(f);
  if (openId) { const d = document.getElementById("t-" + openId); if (d) { d._quiet = true; d.open = true; } }
}

/* forms */
const MEALS = ["All inclusive", "Frühstück inkl.", "Halbpension", "Vollpension", "Nur Zimmer", ""];
const STARS = ["", "2★", "3★", "4★", "5★"];
function field(f, v) {
  const id = "f_" + f.k, val = v ?? f.def ?? "";
  if (f.type === "select") return `<label for="${id}">${f.l}</label><select id="${id}" name="${f.k}">${f.opts.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o || "–"]; return `<option value="${esc(ov)}"${String(ov) === String(val) ? " selected" : ""}>${esc(ol)}</option>` }).join("")}</select>`;
  if (f.type === "check") return `<label class="cb"><input type="checkbox" name="${f.k}"${val ? " checked" : ""}> ${f.l}</label>`;
  if (f.type === "area") return `<label for="${id}">${f.l}</label><textarea id="${id}" name="${f.k}" placeholder="${esc(f.ph || "")}">${esc(val)}</textarea>`;
  return `<label for="${id}">${f.l}</label><input id="${id}" name="${f.k}" type="${f.type || "text"}" value="${esc(val)}" placeholder="${esc(f.ph || "")}"${f.req ? " required" : ""}${f.type === "number" ? ' step="any" inputmode="decimal"' : ""}>`;
}
function openForm(title, fields, values, onSave, adv = []) {
  const sh = document.getElementById("sheet");
  const rows = fields.map(f => Array.isArray(f) ? `<div class="row">${f.map(x => `<div>${field(x, values[x.k])}</div>`).join("")}</div>` : field(f, values[f.k]) + (f.hint ? `<p class="hintx">${f.hint}</p>` : "")).join("");
  const advh = adv.length ? `<details><summary>Erweitert</summary>${adv.map(f => field(f, values[f.k]) + (f.hint ? `<p class="hintx">${f.hint}</p>` : "")).join("")}</details>` : "";
  sh.innerHTML = `<form class="sh" id="frm"><h3>${title}</h3>${rows}${advh}<div class="shb"><button type="button" class="sec" id="fcancel">Abbrechen</button><button type="submit" id="fsave">Speichern</button></div></form>`;
  sh.hidden = false;
  document.getElementById("fcancel").onclick = () => sh.hidden = true;
  sh.onclick = e => { if (e.target === sh) sh.hidden = true; };
  document.getElementById("frm").onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target), o = {};
    [...fields.flat(), ...adv].forEach(f => { o[f.k] = f.type === "check" ? fd.has(f.k) : (fd.get(f.k) ?? "").toString().trim(); if (f.type === "number") o[f.k] = o[f.k] === "" ? null : Number(o[f.k].replace(/'/g, "").replace(",", ".")); });
    const btn = document.getElementById("fsave"); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Speichern…';
    try { await onSave(o); sh.hidden = true; } catch (err) { toast("⚠️ " + esc(err.message)); } finally { btn.disabled = false; btn.textContent = "Speichern"; }
  };
  setTimeout(() => sh.querySelector("input,select")?.focus(), 50);
}

async function reload() { const j = await api("load"); D = j; render(); }

function regionForm(r, cat) {
  r = r || { category: cat, sort: (D.regions.filter(x => x.category === cat).length + 1) };
  openForm(r.id ? "Region bearbeiten" : "Neue Region / Land", [
    { k: "name", l: "Name (mit Emoji)", ph: "z.B. 🇬🇷 Griechenland", req: true },
    [{ k: "sub", l: "Zusatz", ph: "z.B. Juni" }, { k: "sort", l: "Reihenfolge", type: "number" }],
    { k: "category", l: "Kategorie", type: "select", opts: [["strand", "🏝️ Strandferien"], ["stadt", "🏙️ Städtereise"]] },
  ], r, async o => { await api("save_region", { region: { ...o, id: r.id } }); await reload(); toast("✓ Gespeichert"); });
}

function tripForm(t, regionId) {
  const isNew = !t;
  t = t || { region_id: regionId, reco: false, sort: D.trips.filter(x => x.region_id === regionId).length, extras: [] };
  const ex = (t.extras || []).map(([k, v]) => `${k}: ${v}`).join("\n");
  openForm(isNew ? "Neue Reise / Ort" : "Reise bearbeiten", [
    { k: "region_id", l: "Region", type: "select", opts: D.regions.map(r => [r.id, r.name]) },
    [{ k: "flag", l: "Flagge", ph: "🇬🇷" }, { k: "title", l: "Ort *", ph: "z.B. Kreta", req: true }],
    { k: "subtitle", l: "Untertitel", ph: "z.B. Griechenland · Chania" },
    [{ k: "city", l: "Ort für Suche", ph: "z.B. Chania Crete", hint: "" }, { k: "airport", l: "Flughafen (IATA)", ph: "z.B. CHQ" }],
    [{ k: "date_from", l: "Hotel ab", type: "date" }, { k: "date_to", l: "Hotel bis", type: "date" }],
    [{ k: "flight_pp", l: "Flugpreis p.P. (CHF)", type: "number", ph: "leer = suchen" }, { k: "flight_pp_max", l: "bis (optional)", type: "number" }],
    { k: "flight_info", l: "Flug-Info", type: "area", ph: "z.B. Edelweiss nonstop, Hin 10:00 → 14:00" },
    { k: "note", l: "Notiz / Tipp", type: "area" },
    { k: "reco", l: "★ Als Tipp markieren", type: "check" },
    { k: "search", l: "✈️ Flugpreis automatisch suchen (Google Flights)", type: "check", def: isNew || t.flight_pp == null },
  ], { ...t, extras_txt: ex, search: undefined }, async o => {
    const extras = (o.extras_txt || "").split("\n").map(l => l.split(/:\s*/)).filter(a => a[0]).map(([k, ...v]) => [k.trim(), v.join(": ").trim()]);
    const search = o.search && D.has_key && (o.flight_pp == null || !isNew); delete o.search; delete o.extras_txt;
    const j = await api("save_trip", { trip: { ...o, extras, id: t.id }, search });
    await reload();
    const id = j.trip.id; const d = document.getElementById("t-" + id); if (d) d.open = true;
    toast(j.price ? (j.price.ok ? `✓ Gespeichert · Flug CHF ${chf(j.price.price2)} für 2` : `✓ Gespeichert · Flugsuche: ${esc(j.price.error)}`) : (o.search === false || D.has_key ? "✓ Gespeichert" : "✓ Gespeichert · Preissuche inaktiv (kein API-Key)"), 5000);
  }, [
    [{ k: "flight_out", l: "Hinflug (falls anders)", type: "date" }, { k: "flight_back", l: "Rückflug (falls anders)", type: "date" }],
    { k: "flight_url", l: "Flug-Link", ph: "https://…" },
    { k: "extras_txt", l: "Weitere Infos (eine pro Zeile «Titel: Text»)", type: "area", ph: "Transfer: ca. 30 Min." },
    { k: "sort", l: "Reihenfolge", type: "number" },
  ]);
}

function hotelForm(h, tripId) {
  const isNew = !h;
  const t = D.trips.find(x => x.id === (h?.trip_id || tripId));
  h = h || { trip_id: tripId, meal: D.regions.find(r => r.id === t.region_id)?.category === "strand" ? "All inclusive" : "", sort: 0 };
  openForm(isNew ? `Hotel hinzufügen · ${esc(t.title)}` : "Hotel bearbeiten", [
    { k: "name", l: "Hotelname *", ph: "z.B. Iberostar Selection …", req: true },
    [{ k: "stars", l: "Sterne", type: "select", opts: STARS }, { k: "rating", l: "Bewertung", ph: "z.B. 8.7" }],
    { k: "meal", l: "Verpflegung", type: "select", opts: MEALS.map(m => [m, m || "–"]) },
    { k: "total2", l: `Preis total für 2 Personen (CHF, ${nights(t)} Nächte)`, type: "number", ph: "leer = automatisch suchen" },
    { k: "note", l: "Beschreibung", type: "area", ph: "Strand, Renovation, Essen …" },
    { k: "food", l: "Essen (falls nicht All inclusive)", type: "area", ph: "Anzahl Restaurants, Preise p.P./Mahlzeit" },
    { k: "search", l: "🔄 Preis automatisch suchen (Google Hotels)", type: "check", def: isNew },
  ], { ...h, search: undefined }, async o => {
    const search = o.search && D.has_key; delete o.search;
    if (o.total2 != null && (isNew || o.total2 !== Number(h.total2))) { o.src = o.src || "manuell"; o.price_status = "ok"; }
    if (o.booking_url === "") o.booking_url = null;
    if (o.maps_url === "") o.maps_url = null;
    const j = await api("save_hotel", { hotel: { ...o, trip_id: h.trip_id, id: h.id }, search: search && (o.total2 == null || !isNew) });
    await reload();
    toast(j.price ? (j.price.ok ? `✓ Gespeichert · Preis gefunden: CHF ${chf(j.price.hotel.total2)} für 2` : `✓ Gespeichert · ${esc(j.price.error)}`) : "✓ Gespeichert · Booking- & Karten-Link erstellt", 5000);
  }, [
    { k: "src", l: "Quelle", ph: "Booking / Trivago / manuell" },
    { k: "booking_url", l: "Booking-Link", hint: "Leer lassen = automatisch erstellen" },
    { k: "maps_url", l: "Karten-Link", hint: "Leer lassen = automatisch erstellen" },
  ]);
}

async function busy(btn, fn) { const t = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Suche…'; try { await fn(); } catch (e) { toast("⚠️ " + esc(e.message)); } finally { btn.disabled = false; btn.innerHTML = t; } }

document.addEventListener("click", e => { onClick(e).catch(x => toast("⚠️ " + esc(x.message))); });
async function onClick(e) {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (["edit", "lock"].includes(a) || b.tagName === "BUTTON") e.preventDefault();
  if (a === "edit") { EDIT = !EDIT; document.body.classList.toggle("edit", EDIT); b.textContent = EDIT ? "✓ Fertig" : "✏️ Bearbeiten"; return; }
  if (a === "lock") { ss(KEY, null); location.reload(); return; }
  if (a === "rnew") return regionForm(null, b.dataset.cat);
  if (a === "redit") return regionForm(D.regions.find(r => r.id === id));
  if (a === "rdel") { const r = D.regions.find(x => x.id === id); const n = D.trips.filter(t => t.region_id === id).length; if (!confirm(`Region «${r.name}» löschen?${n ? `\nAuch ${n} Reise(n) mit allen Hotels werden gelöscht.` : ""}`)) return; await api("delete_region", { id }); await reload(); return toast("🗑️ Gelöscht"); }
  if (a === "tnew") return tripForm(null, id);
  if (a === "tedit") return tripForm(D.trips.find(t => t.id === id));
  if (a === "tdel") { const t = D.trips.find(x => x.id === id); if (!confirm(`Reise «${t.title}» mit allen Hotels löschen?`)) return; await api("delete_trip", { id }); await reload(); return toast("🗑️ Gelöscht"); }
  if (a === "hnew") return hotelForm(null, id);
  if (a === "hedit") return hotelForm(D.hotels.find(h => h.id === id));
  if (a === "hdel") { const h = D.hotels.find(x => x.id === id); if (!confirm(`Hotel «${h.name}» löschen?`)) return; await api("delete_hotel", { id }); await reload(); return toast("🗑️ Gelöscht"); }
  if (a === "hprice" || a === "fprice") {
    if (!D.has_key) return toast("⚠️ Preissuche inaktiv – SerpApi-Key fehlt noch", 4500);
    return busy(b, async () => {
      const j = await api(a === "hprice" ? "hotel_price" : "flight_price", { id });
      await reload();
      toast(j.ok ? (a === "hprice" ? `✓ CHF ${chf(j.hotel.total2)} für 2 (${esc(j.matched)})` : `✓ Flug CHF ${chf(j.price2)} für 2`) : "⚠️ " + esc(j.error), 5000);
    });
  }
}

/* lock */
const f = document.getElementById("f"), pin = document.getElementById("pin"), go = document.getElementById("go"), err = document.getElementById("err");
async function tryPin(v, silent) {
  go.disabled = true; err.textContent = ""; PIN = v;
  try {
    D = await api("load"); ss(KEY, v);
    document.getElementById("lock").remove(); document.getElementById("app").hidden = false; render();
  } catch (e) {
    if (!silent) { err.textContent = e.status === 401 ? "Falscher PIN" : e.message; f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); pin.value = ""; pin.focus(); }
    ss(KEY, null);
  } finally { go.disabled = false; }
}
f.onsubmit = e => { e.preventDefault(); if (pin.value) tryPin(pin.value); };
pin.oninput = () => { pin.value = pin.value.replace(/\D/g, ""); if (pin.value.length === 4) tryPin(pin.value); };
const saved = sg(KEY); if (saved) tryPin(saved, true);

</script>
