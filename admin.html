<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Steuerung · Mirelas Tag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<main class="wrap">
  <header>
    <p class="eyebrow">Nur für Bejhan</p>
    <h1>Steuerung</h1>
    <p class="lede">Was du hier änderst, sieht Mirela innert etwa 20 Sekunden auf ihrer Seite.</p>
  </header>

  <form class="panel" id="login" hidden>
    <label for="email">E-Mail</label>
    <input id="email" type="email" autocomplete="username" placeholder="name@beispiel.ch" required>
    <label for="password">Passwort</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <div class="actions"><button id="signIn" type="submit">Anmelden</button></div>
    <p id="loginMsg" class="msg" hidden></p>
  </form>

  <section class="panel" id="panel" hidden>
    <div class="switch">
      <p class="switch-label">Programm für Mirela</p>
      <div class="seg" role="group" aria-label="Wetter-Variante">
        <button type="button" id="v-gut" data-variant="gut">Schönwetter<small>Pilatus</small></button>
        <button type="button" id="v-schlecht" data-variant="schlecht">Schlechtwetter<small>Schifffahrt</small></button>
      </div>
      <p class="switch-hint" id="switchHint"></p>
    </div>

    <details class="texts" id="textsBox">
      <summary>Titel und Untertitel von Mirelas Seite</summary>
      <form id="textForm" class="editor">
        <div class="field"><label for="t-title">Titel</label><input id="t-title" required maxlength="80"></div>
        <div class="field"><label for="t-subtitle">Untertitel <span class="opt">optional</span></label><textarea id="t-subtitle" rows="2" maxlength="240"></textarea></div>
        <div class="actions"><button type="submit" id="textSave">Texte speichern</button></div>
      </form>
    </details>

    <div class="filterbar" role="group" aria-label="Anzeige">
      <span>Liste zeigt</span>
      <button type="button" class="pill" id="f-active" data-filter="active">Aktives Programm</button>
      <button type="button" class="pill" id="f-all" data-filter="all">Alle Einträge</button>
    </div>

    <p id="msg" class="msg" hidden></p>
    <ul class="entries" id="rows"></ul>
    <div id="newWrap"></div>
    <div class="actions">
      <button id="addNew" type="button">Neuer Eintrag</button>
      <button class="ghost" id="hideAll" type="button">Alle wieder verbergen</button>
      <button class="ghost" id="logout" type="button">Abmelden</button>
    </div>
    <details>
      <summary>Passwort ändern</summary>
      <form id="pwForm" class="panel" style="margin-top:12px">
        <label for="newPw">Neues Passwort (mind. 8 Zeichen)</label>
        <input id="newPw" type="password" autocomplete="new-password" minlength="8" required>
        <div class="actions"><button type="submit" id="pwSave">Passwort speichern</button></div>
        <p id="pwMsg" class="msg" hidden></p>
      </form>
    </details>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=7"></script>
<script>
(function(){
  var sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  var items = [], busy = false, editing = null, confirmDel = null;
  var variant = 'schlecht', filter = 'active', textDirty = false;
  var VLABEL = { beide: 'Beide', gut: 'Schönwetter', schlecht: 'Schlechtwetter' };

  try { if (localStorage.getItem('adminFilter') === 'all') filter = 'all'; } catch (e) {}

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}); }
  function say(el, text, isErr){ el.textContent = text || ''; el.hidden = !text; el.classList.toggle('err', !!isErr); }
  function val(id){ var el = $(id); return el ? el.value.trim() : ''; }
  function byId(id){ return items.find(function(x){ return x.id === id; }); }
  function isActive(it){ return it.variant === 'beide' || it.variant === variant; }
  function visible(){ return filter === 'all' ? items : items.filter(isActive); }

  function fieldHTML(id, label, opt, control){
    return '<div class="field"><label for="'+id+'">'+label+(opt?' <span class="opt">'+opt+'</span>':'')+'</label>'+control+'</div>';
  }

  function editorHTML(it){
    it = it || { variant: 'beide' };
    var del = it.id
      ? '<button type="button" class="danger'+(confirmDel===it.id?' sure':'')+'" data-act="delete">'+(confirmDel===it.id?'Ja, endgültig löschen':'Löschen')+'</button>'
      : '';
    var opts = ['beide','gut','schlecht'].map(function(v){
      return '<option value="'+v+'"'+(it.variant===v?' selected':'')+'>'+(v==='beide'?'Beide Programme':'Nur '+VLABEL[v])+'</option>';
    }).join('');
    return '<form class="editor" id="editor">'+
      fieldHTML('f-variant', 'Gilt für', '', '<select id="f-variant">'+opts+'</select>')+
      fieldHTML('f-time', 'Uhrzeit', '', '<input id="f-time" required placeholder="z. B. 14:30 – 16:00" value="'+esc(it.time_label)+'">')+
      fieldHTML('f-title', 'Titel', '', '<input id="f-title" required value="'+esc(it.title)+'">')+
      fieldHTML('f-place', 'Untertitel', 'optional', '<input id="f-place" value="'+esc(it.place)+'">')+
      fieldHTML('f-note', 'Beschreibung', 'optional', '<textarea id="f-note" rows="3">'+esc(it.note)+'</textarea>')+
      fieldHTML('f-location', 'Ort', 'optional, erscheint als Kartenlink', '<input id="f-location" placeholder="z. B. Furrengasse 6, 6004 Luzern" value="'+esc(it.location)+'">')+
      '<div class="actions"><button type="submit"'+(busy?' disabled':'')+'>Speichern</button>'+
      '<button type="button" class="ghost" data-act="cancel">Abbrechen</button>'+del+'</div>'+
    '</form>';
  }

  function renderSwitch(){
    ['gut','schlecht'].forEach(function(v){
      var b = $('v-'+v);
      b.setAttribute('aria-pressed', variant === v ? 'true' : 'false');
      b.classList.toggle('on', variant === v);
      b.disabled = busy;
    });
    var shared = items.filter(function(x){ return x.variant === 'beide'; }).length;
    var own = items.filter(function(x){ return x.variant === variant; }).length;
    $('switchHint').textContent = 'Mirela sieht jetzt das ' + VLABEL[variant] + '-Programm: ' + shared + ' gemeinsame und ' + own + ' eigene Punkte.';
    $('f-active').classList.toggle('on', filter === 'active');
    $('f-all').classList.toggle('on', filter === 'all');
    $('f-active').setAttribute('aria-pressed', filter === 'active' ? 'true' : 'false');
    $('f-all').setAttribute('aria-pressed', filter === 'all' ? 'true' : 'false');
  }

  function render(){
    renderSwitch();
    var list = visible();
    $('rows').innerHTML = list.map(function(it, i){
      var on = it.revealed, dis = busy ? ' disabled' : '', open = editing === it.id, active = isActive(it);
      var vchip = it.variant === 'beide' ? '' : '<span class="vchip v-'+it.variant+'">'+VLABEL[it.variant]+'</span>';
      return '<li class="entry'+(on?' is-on':'')+(active?'':' is-off')+'" data-id="'+esc(it.id)+'">'+
        '<div class="entry-top"><span class="entry-time">'+esc(it.time_label)+'</span>'+
          '<span class="chips">'+vchip+'<span class="chip'+(on?' on':'')+'">'+(on?'Sichtbar':'Gesperrt')+'</span></span></div>'+
        (active ? '' : '<p class="entry-off">Nicht im aktiven Programm, Mirela sieht diesen Punkt gerade nicht.</p>')+
        (open ? '' :
          '<p class="entry-title">'+esc(it.title)+'</p>'+
          (it.place ? '<p class="entry-sub">'+esc(it.place)+'</p>' : '')+
          (it.note ? '<p class="entry-note">'+esc(it.note)+'</p>' : '')+
          (it.location ? '<p class="entry-loc">Ort: '+esc(it.location)+'</p>' : ''))+
        (open ? editorHTML(it) :
          '<div class="entry-actions">'+
            '<button type="button" data-act="toggle"'+(on?' class="ghost"':'')+dis+'>'+(on?'Verbergen':'Freischalten')+'</button>'+
            '<button type="button" class="ghost" data-act="edit"'+dis+'>Bearbeiten</button>'+
            '<span class="spacer"></span>'+
            '<button type="button" class="icon" data-act="up" aria-label="Nach oben"'+(i===0||busy?' disabled':'')+'>↑</button>'+
            '<button type="button" class="icon" data-act="down" aria-label="Nach unten"'+(i===list.length-1||busy?' disabled':'')+'>↓</button>'+
          '</div>')+
      '</li>';
    }).join('');
    $('newWrap').innerHTML = editing === 'new' ? '<div class="entry" data-id="new"><p class="entry-title">Neuer Eintrag</p>'+editorHTML(null)+'</div>' : '';
    $('addNew').hidden = editing === 'new';
    $('hideAll').disabled = busy;
  }

  async function loadAll(){
    var r1 = await sb.from('plan').select('*').order('sort').order('time_label');
    if (r1.error) { say($('msg'), 'Die Einträge konnten nicht geladen werden: ' + r1.error.message, true); return; }
    items = r1.data || [];
    var r2 = await sb.from('settings').select('key,value');
    if (!r2.error && r2.data) {
      r2.data.forEach(function(s){
        if (s.key === 'variant') variant = s.value;
        if (s.key === 'title' && !textDirty) $('t-title').value = s.value;
        if (s.key === 'subtitle' && !textDirty) $('t-subtitle').value = s.value;
      });
    }
    render();
  }

  async function run(steps, okText){
    busy = true; render(); say($('msg'), 'Wird gespeichert …');
    for (var i = 0; i < steps.length; i++) {
      var res = await steps[i]();
      if (res.error) { busy = false; render(); say($('msg'), 'Speichern hat nicht geklappt: ' + res.error.message, true); return false; }
    }
    busy = false;
    await loadAll();
    say($('msg'), okText);
    return true;
  }

  function move(id, dir){
    var list = visible();
    var i = list.findIndex(function(x){ return x.id === id; }), j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return;
    var a = id, b = list[j].id;
    var order = items.map(function(x){ return x.id; });
    var ia = order.indexOf(a), ib = order.indexOf(b);
    order[ia] = b; order[ib] = a;
    var steps = [];
    order.forEach(function(oid, idx){
      var want = (idx + 1) * 10;
      if (byId(oid).sort !== want) steps.push(function(){ return sb.from('plan').update({ sort: want }).eq('id', oid); });
    });
    run(steps, 'Reihenfolge gespeichert.');
  }

  async function saveEditor(){
    var data = {
      variant: val('f-variant') || 'beide',
      time_label: val('f-time'),
      title: val('f-title'),
      place: val('f-place') || null,
      location: val('f-location') || null,
      note: val('f-note') || null
    };
    if (!data.time_label || !data.title) { say($('msg'), 'Uhrzeit und Titel braucht jeder Eintrag.', true); return; }
    var ok;
    if (editing === 'new') {
      var maxSort = items.reduce(function(m, x){ return Math.max(m, x.sort || 0); }, 0);
      data.sort = maxSort + 10; data.revealed = false;
      ok = await run([function(){ return sb.from('plan').insert(data); }], 'Neuer Eintrag gespeichert. Er ist für Mirela noch gesperrt.');
    } else {
      var id = editing;
      ok = await run([function(){ return sb.from('plan').update(data).eq('id', id); }], 'Änderungen gespeichert.');
    }
    if (ok) { editing = null; confirmDel = null; render(); }
  }

  function onAction(e){
    var b = e.target.closest('button[data-act]'); if (!b || busy) return;
    var holder = b.closest('[data-id]'); var id = holder ? holder.getAttribute('data-id') : null;
    var act = b.getAttribute('data-act');
    if (act === 'up') move(id, -1);
    else if (act === 'down') move(id, 1);
    else if (act === 'toggle') {
      var it = byId(id); if (!it) return;
      run([function(){ return sb.from('plan').update({ revealed: !it.revealed }).eq('id', id); }],
          it.revealed ? 'Wieder verborgen.' : (isActive(it) ? 'Freigeschaltet. Mirela sieht es gleich.' : 'Freigeschaltet. Sichtbar wird es erst im ' + VLABEL[it.variant] + '-Programm.'));
    }
    else if (act === 'edit') { editing = id; confirmDel = null; say($('msg'), ''); render(); var f = $('f-time'); if (f) f.focus(); }
    else if (act === 'cancel') { editing = null; confirmDel = null; render(); }
    else if (act === 'delete') {
      if (confirmDel !== id) { confirmDel = id; render(); return; }
      run([function(){ return sb.from('plan').delete().eq('id', id); }], 'Eintrag gelöscht.')
        .then(function(ok){ if (ok) { editing = null; confirmDel = null; render(); } });
    }
  }
  $('rows').addEventListener('click', onAction);
  $('newWrap').addEventListener('click', onAction);
  document.addEventListener('submit', function(e){
    if (e.target && e.target.id === 'editor') { e.preventDefault(); saveEditor(); }
  });

  document.querySelector('.seg').addEventListener('click', function(e){
    var b = e.target.closest('button[data-variant]'); if (!b || busy) return;
    var v = b.getAttribute('data-variant'); if (v === variant) return;
    run([function(){ return sb.from('settings').update({ value: v }).eq('key', 'variant'); }],
        'Umgeschaltet auf ' + VLABEL[v] + '. Mirela sieht es gleich.');
  });
  document.querySelector('.filterbar').addEventListener('click', function(e){
    var b = e.target.closest('button[data-filter]'); if (!b) return;
    filter = b.getAttribute('data-filter');
    try { localStorage.setItem('adminFilter', filter); } catch (err) {}
    editing = null; confirmDel = null; render();
  });

  $('t-title').addEventListener('input', function(){ textDirty = true; });
  $('t-subtitle').addEventListener('input', function(){ textDirty = true; });
  $('textForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var t = $('t-title').value.trim(), st = $('t-subtitle').value.trim();
    if (!t) { say($('msg'), 'Der Titel darf nicht leer sein.', true); return; }
    textDirty = false;
    var ok = await run([
      function(){ return sb.from('settings').update({ value: t }).eq('key', 'title'); },
      function(){ return sb.from('settings').update({ value: st }).eq('key', 'subtitle'); }
    ], 'Titel und Untertitel gespeichert.');
    if (ok) $('textsBox').open = false;
  });

  $('addNew').addEventListener('click', function(){
    editing = 'new'; confirmDel = null; say($('msg'), ''); render();
    var f = $('f-time'); if (f) f.focus();
  });
  $('hideAll').addEventListener('click', function(){
    run([function(){ return sb.from('plan').update({ revealed: false }).neq('id', ''); }], 'Alle Punkte sind wieder verborgen.');
  });
  $('logout').addEventListener('click', function(){ sb.auth.signOut(); });

  $('login').addEventListener('submit', async function(e){
    e.preventDefault();
    $('signIn').disabled = true; say($('loginMsg'), 'Anmeldung läuft …');
    var res = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
    $('signIn').disabled = false;
    if (res.error) say($('loginMsg'), 'Anmeldung fehlgeschlagen. Prüfe E-Mail und Passwort.', true);
    else { say($('loginMsg'), ''); $('password').value = ''; }
  });

  $('pwForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var pw = $('newPw').value;
    if (pw.length < 8) { say($('pwMsg'), 'Das Passwort braucht mindestens 8 Zeichen.', true); return; }
    $('pwSave').disabled = true;
    var res = await sb.auth.updateUser({ password: pw });
    $('pwSave').disabled = false;
    if (res.error) say($('pwMsg'), 'Speichern hat nicht geklappt: ' + res.error.message, true);
    else { $('newPw').value = ''; say($('pwMsg'), 'Neues Passwort gespeichert.'); }
  });

  var shown = null;
  function show(session){
    var key = session ? session.user.id : '';
    if (key === shown) return; shown = key;
    $('login').hidden = !!session;
    $('panel').hidden = !session;
    if (session) loadAll();
  }
  sb.auth.getSession().then(function(r){ show(r.data.session); });
  sb.auth.onAuthStateChange(function(_event, session){ show(session); });
})();
</script>
</body>
</html>
