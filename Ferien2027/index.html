<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ferien 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Gloock&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F9;--card:#FFF;--ink:#17213A;--muted:#5B667D;--line:#D6DDE8;--lake:#24507E;--gold:#B5822A;--gold-soft:#F6EBD6;--ok:#2E7D4F;--ok-soft:#E3F2E8;--warn:#A4521B;--warn-soft:#FBE9DC}
@media (prefers-color-scheme:dark){:root{--bg:#0F1524;--card:#18213A;--ink:#E8ECF4;--muted:#9AA5BC;--line:#2B3654;--lake:#7FA8D6;--gold:#D9A954;--gold-soft:#3A2F1A;--ok:#7CCB9A;--ok-soft:#18332A;--warn:#E8A070;--warn-soft:#3A2618}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Gloock,Georgia,serif;font-weight:400;line-height:1.15;margin:0}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 64px}
/* lock */
#lock{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-card{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:30px 22px;border-radius:16px;background:var(--card);border:1px solid var(--gold)}
.lock-card h1{font-size:clamp(36px,10vw,46px)}
.lock-card p{margin:0;color:var(--muted)}
#pin{width:100%;font:inherit;font-size:28px;letter-spacing:.5em;text-align:center;padding:12px 0 12px .5em;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
#pin:focus{outline:2px solid var(--lake);outline-offset:1px}
button{font:inherit;font-size:16px;font-weight:600;border-radius:10px;padding:11px 16px;cursor:pointer;border:1px solid var(--lake);background:var(--lake);color:var(--bg);width:100%}
button:disabled{opacity:.6;cursor:wait}
#err{color:var(--warn);min-height:1.5em;font-size:14px}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* content */
.plan{background:var(--card);border:1px solid var(--gold);border-radius:16px;padding:14px;margin-bottom:16px}
.plan h2{font-size:22px}
.plan-sub{margin:4px 0 12px;font-size:14px;color:var(--muted)}
.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.plan-grid{grid-template-columns:1fr}}
.pg{background:var(--bg);border-radius:12px;padding:10px}
.pg h3{font-family:Figtree,sans-serif;font-weight:700;font-size:16px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.pg h3 em{font-style:normal;font-size:12px;font-weight:600;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:2px 8px}
.opt{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.ol{width:26px;height:26px;border-radius:50%;background:var(--lake);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.od{min-width:0;font-size:14px;line-height:1.35}
.od b{display:block;font-size:15px}
.od span{display:block;font-variant-numeric:tabular-nums;white-space:nowrap}
.od small{display:block;color:var(--muted);font-size:12px}
.on{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.on b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.on span{display:block}
.or{display:flex;align-items:center;gap:8px;margin:4px 0;color:var(--gold);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

.wrap{padding-top:18px}
.hero{text-align:center;padding:6px 0 16px}
.eyebrow{margin:0 0 4px;color:var(--gold);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:12px}
.hero h1{font-size:clamp(38px,10vw,58px)}
.lede{color:var(--muted);max-width:520px;margin:8px auto 0;font-size:15px}
.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px;margin:0 -4px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 14px rgba(23,33,58,.06)}
.tabs button{width:auto;background:transparent;color:var(--muted);border:0;border-radius:10px;padding:10px 6px;font-size:15px}
.tabs button[aria-selected=true]{background:var(--lake);color:var(--bg)}
.panel[hidden]{display:none}
.reco{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:11px 14px;font-size:15px;margin-bottom:12px}
.overview{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ov-head,.ov-row{display:grid;grid-template-columns:1fr auto 14px;gap:12px;align-items:center;padding:11px 14px}
.ov-head{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--bg);padding-top:8px;padding-bottom:8px}
.ov-head span:nth-child(2){text-align:right}
.ov-row{border-top:1px solid var(--line);color:inherit;text-decoration:none}
.ov-row:active{background:var(--bg)}
.ov-name{font-weight:600;font-size:16px}
.ov-name small,.ov-price small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.ov-price{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.ov-row.warn .ov-price{color:var(--warn)}
.star{color:var(--gold);margin-left:5px}
.dot{width:10px;height:10px;border-radius:50%}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}
.sec{font-size:24px;margin:26px 0 2px}.grp{font-size:21px;margin:18px 0 8px}.grp small{font-family:Figtree,sans-serif;font-size:13px;color:var(--muted);margin-left:6px}.sub-h{font-size:19px;margin:18px 0 4px;color:var(--muted)}
.legend{font-size:12px;color:var(--muted);margin:0 0 10px}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-left:6px}
.sw:first-child{margin-left:0}
.sw.edge{background:var(--gold-soft);border:1px solid var(--gold)}
.sw.over{background:var(--warn-soft);border:1px solid var(--warn)}
.trip{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:14px;margin:10px 0;scroll-margin-top:74px}
.trip.warn{border-left-color:var(--warn)}
.trip summary{list-style:none;cursor:pointer;padding:14px 14px 12px;position:relative}
.trip summary::-webkit-details-marker{display:none}
.s-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.s-top h3{font-size:22px}
.region{margin:2px 0 0;color:var(--muted);font-size:13px}
.s-price{text-align:right;white-space:nowrap}
.s-price b{font-size:19px;font-variant-numeric:tabular-nums}
.trip.warn .s-price b{color:var(--warn)}
.s-price small{display:block;color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.chip,.tag{font-size:13px;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.tag{font-weight:600;border-color:transparent}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.reco{background:var(--gold-soft);color:var(--gold)}
.more{display:inline-block;margin-top:10px;font-size:14px;font-weight:600;color:var(--lake)}
.more::after{content:" ▾"}
details[open] .more::after{content:" ▴"}
details[open] .more{font-size:0}
details[open] .more::after{font-size:14px;content:"Weniger ▴"}
.body{padding:0 14px 14px}
.flight{display:flex;gap:10px;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15px}
.fl-ic{font-size:18px}
.muted{color:var(--muted);font-size:14px}
.extra{margin:10px 0 0;padding-left:18px;font-size:15px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:9px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--bg)}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tot{font-weight:700}
.hn{font-weight:600}.lk{display:flex;gap:6px;flex-wrap:wrap}tr.hr td{border-bottom:0;padding-bottom:4px}tr.lkr td{padding-top:0}.lk a{font-size:12px;font-weight:600;color:var(--lake);text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:2px 9px;white-space:nowrap}.lk a:active{background:var(--bg)}.trip.city{border-left-color:var(--lake)}
td small{display:block;color:var(--muted);font-size:13px}
.meta{display:block;font-size:12px;color:var(--muted)}
tr.edge td{background:var(--gold-soft)}
tr.over td{background:var(--warn-soft)}
.note{margin:10px 0 0;font-size:14px;color:var(--muted)}
.info-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.info-card h3{font-size:22px}
.tips{padding-left:20px;margin:8px 0 0}
.tips li{margin:6px 0}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}
.foot a{color:var(--lake)}
@media (max-width:560px){table{font-size:14px}th,td{padding:8px 7px}.c2{display:none}.tot{white-space:normal}}
</style>
</head>
<body>
<div id="lock">
  <form class="lock-card" id="f" autocomplete="off">
    <h1>Ferien 2027</h1>
    <p>Bitte PIN eingeben</p>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" aria-label="PIN" autofocus>
    <button id="go" type="submit">Öffnen</button>
    <div id="err" role="alert"></div>
  </form>
</div>
<main class="wrap" id="app" hidden></main>

const KEY="ferien2027-pin";
const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pin){
  const e=new TextEncoder();
  const b=await crypto.subtle.importKey("raw",e.encode(pin),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d(P.s),iterations:P.n,hash:"SHA-256"},b,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d(P.i)},k,d(P.c));
  return new TextDecoder().decode(pt);
}
function show(h){
  const a=document.getElementById("app");
  a.innerHTML=h+'<p class="foot">Stand November 2026 · <a href="#" id="lockBtn">Sperren</a></p>';
  document.getElementById("lock").remove();a.hidden=false;
  const tabs=[...a.querySelectorAll("[data-tab]")],panels=[...a.querySelectorAll("[data-panel]")];
  const sel=t=>{tabs.forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));panels.forEach(p=>p.hidden=p.dataset.panel!==t);try{sessionStorage.setItem("ferien2027-tab",t)}catch(_){}};
  tabs.forEach(b=>b.onclick=()=>{sel(b.dataset.tab);window.scrollTo({top:a.querySelector(".tabs").offsetTop-4,behavior:"smooth"})});
  a.querySelectorAll("[data-open]").forEach(r=>r.onclick=e=>{e.preventDefault();const d=document.getElementById(r.dataset.open);d.open=true;d.scrollIntoView({behavior:"smooth"})});
  let t0=null;try{t0=sessionStorage.getItem("ferien2027-tab")}catch(_){} if(t0)sel(t0);
  document.getElementById("lockBtn").onclick=e=>{e.preventDefault();try{sessionStorage.removeItem(KEY)}catch(_){}location.reload()};
}
const f=document.getElementById("f"),pin=document.getElementById("pin"),go=document.getElementById("go"),err=document.getElementById("err");
async function tryPin(v,silent){
  go.disabled=true;err.textContent="";
  try{const h=await unlock(v);try{sessionStorage.setItem(KEY,v)}catch(_){}show(h)}
  catch(_){if(!silent){err.textContent="Falscher PIN";f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");pin.value="";pin.focus()}try{sessionStorage.removeItem(KEY)}catch(_){}}
  finally{go.disabled=false}
}
f.onsubmit=e=>{e.preventDefault();if(pin.value)tryPin(pin.value)};
pin.oninput=()=>{pin.value=pin.value.replace(/\D/g,"");if(pin.value.length===4)tryPin(pin.value)};
let saved=null;try{saved=sessionStorage.getItem(KEY)}catch(_){}
if(saved)tryPin(saved,true);
