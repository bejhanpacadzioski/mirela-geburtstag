<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Alles Gute, Mirela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=24">
</head>
<body>
<main class="wrap">
  <header>
    <p class="eyebrow" id="eyebrow">Freitag, 27. November 2026 · Luzern</p>
    <h1 id="pageTitle">Alles Gute, Mirela</h1>
    <p class="lede" id="pageSubtitle">Heute gehört dir. Was wir vorhaben, erfährst du erst, wenn es so weit ist.</p>
    <div class="infobar"><span class="badge" id="variantBadge" hidden></span></div>
    <section class="weather" id="weather" hidden></section>
    <div class="progress"><div class="bar"><span id="bar"></span></div><span id="count"></span></div>
  </header>
  <section class="choice" id="choice" hidden aria-labelledby="choiceTitle"></section>
  <ol class="timeline" id="timeline"><li class="status">Dein Tag wird geladen …</li></ol>
  <section class="letter" id="letter" hidden></section>
  <section class="album" id="album" hidden></section>
  <p class="sign">Von Bejhan, mit Liebe.</p>
</main>
<canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=24"></script>
<script>
(function(){
  var sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  var BIRTHDAY = '2026-11-27', weatherLoadedFor = null;
  function shortDate(iso){ var a = iso.split('-'); return Number(a[2]) + '.' + Number(a[1]) + '.'; }
  var FILE_ICON = '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5h5l3.5 3.5v9.5h-8.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 1.5V5h3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
  var LOCK = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="currentColor"/><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
  var PIN = '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a4.5 4.5 0 0 0-4.5 4.5c0 3.4 4.5 8.5 4.5 8.5s4.5-5.1 4.5-8.5A4.5 4.5 0 0 0 8 1.5Zm0 6.2a1.7 1.7 0 1 1 0-3.4 1.7 1.7 0 0 1 0 3.4Z" fill="currentColor"/></svg>';
  var lastKey = '', lastPage = '', seenOpen = null;

  function $(id){ return document.getElementById(id); }
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function mapLink(q){ return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q); }

  /* ---------- Programm ---------- */
  /* ---------- Freirubbeln & Benachrichtigung ---------- */
  var SCRATCH_KEY = 'mirela-scratched';
  function getScratched(){ try { return JSON.parse(localStorage.getItem(SCRATCH_KEY) || '[]'); } catch (e) { return []; } }
  function markScratched(id){
    var s = getScratched(); if (s.indexOf(id) === -1) s.push(id);
    try { localStorage.setItem(SCRATCH_KEY, JSON.stringify(s)); } catch (e) {}
  }
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function attachScratch(card, id){
    var c = document.createElement('canvas');
    c.className = 'scratch';
    c.setAttribute('aria-hidden', 'true');
    var skip = document.createElement('button');
    skip.type = 'button'; skip.className = 'scratch-skip'; skip.textContent = 'Aufdecken';
    card.appendChild(c); card.appendChild(skip); card.classList.add('is-covered');
    var r = card.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    c.width = Math.max(1, Math.round(r.width * dpr)); c.height = Math.max(1, Math.round(r.height * dpr));
    var ctx = c.getContext('2d');
    ctx.scale(dpr, dpr);
    var cs = getComputedStyle(document.documentElement);
    var g = ctx.createLinearGradient(0, 0, r.width, r.height);
    g.addColorStop(0, '#E9C980'); g.addColorStop(.5, '#C99A3E'); g.addColorStop(1, '#E3BE6E');
    ctx.fillStyle = g; ctx.fillRect(0, 0, r.width, r.height);
    for (var i = 0; i < 260; i++) {
      ctx.fillStyle = 'rgba(255,255,255,' + (Math.random() * .18) + ')';
      ctx.fillRect(Math.random() * r.width, Math.random() * r.height, 1.5, 1.5);
    }
    ctx.fillStyle = 'rgba(40,28,8,.78)';
    ctx.font = '400 21px ' + (cs.getPropertyValue('--display') || 'Georgia, serif');
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Freirubbeln', r.width / 2, r.height / 2 - 9);
    ctx.font = '500 13px ' + (cs.getPropertyValue('--body') || 'system-ui, sans-serif');
    ctx.fillText('mit dem Finger über die Karte wischen', r.width / 2, r.height / 2 + 15);
    ctx.globalCompositeOperation = 'destination-out';

    var down = false, last = null, moves = 0, done = false;
    function reveal(){
      if (done) return; done = true;
      markScratched(id);
      card.classList.remove('is-covered');
      c.classList.add('gone'); skip.remove();
      setTimeout(function(){ c.remove(); }, reduceMotion ? 0 : 500);
    }
    function pt(e){ var b = c.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; }
    function scratch(p){
      ctx.lineWidth = 46; ctx.lineCap = 'round';
      ctx.beginPath();
      if (last) { ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); }
      ctx.arc(p.x, p.y, 23, 0, Math.PI * 2); ctx.fill();
      last = p;
      if (++moves % 12 === 0) check();
    }
    function check(){
      var d = ctx.getImageData(0, 0, c.width, c.height).data, clear = 0, total = 0;
      for (var i = 3; i < d.length; i += 4 * 40) { total++; if (d[i] < 40) clear++; }
      if (total && clear / total > .5) reveal();
    }
    c.addEventListener('pointerdown', function(e){ down = true; last = null; c.setPointerCapture(e.pointerId); scratch(pt(e)); });
    c.addEventListener('pointermove', function(e){ if (down) scratch(pt(e)); });
    c.addEventListener('pointerup', function(){ down = false; last = null; check(); });
    c.addEventListener('pointercancel', function(){ down = false; last = null; });
    skip.addEventListener('click', reveal);
  }

  var toastTimer = null;
  function notifyNew(titles){
    try { if (navigator.vibrate) navigator.vibrate([140, 90, 140]); } catch (e) {}
    var t = $('toast');
    t.textContent = titles.length === 1 ? 'Neu freigeschaltet: ' + titles[0] : titles.length + ' neue Momente freigeschaltet';
    t.hidden = false;
    requestAnimationFrame(function(){ t.classList.add('show'); });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ t.hidden = true; }, 400); }, 5000);
  }

  var choicePending = false, choiceOpenNow = false;
  function render(slots, files){
    files = files || [];
    var open = slots.filter(function(s){return s.revealed});
    var openIds = open.map(function(s){return s.id});
    var scratched = getScratched();
    var newly = seenOpen ? open.filter(function(s){ return seenOpen.indexOf(s.id) === -1; }) : [];
    $('bar').parentNode.hidden = hideLocked;
    $('bar').style.width = (slots.length ? Math.round(open.length/slots.length*100) : 0) + '%';
    $('count').textContent = hideLocked
      ? (open.length === 1 ? '1 Moment enthüllt' : open.length + ' Momente enthüllt')
      : open.length + ' von ' + slots.length + ' Momenten enthüllt';
    var list = slots.map(function(s){
      if (s.revealed) {
        var fresh = seenOpen && seenOpen.indexOf(s.id) === -1 ? ' fresh' : '';
        var cover = scratched.indexOf(s.id) === -1 ? ' data-scratch="'+esc(s.id)+'"' : '';
        return '<li class="slot open'+fresh+'"><div class="time">'+esc(s.time_label)+'</div><div class="card"'+cover+'><h2>'+esc(s.title)+'</h2>'+
          (s.place ? '<p class="place">'+esc(s.place)+'</p>' : '') + (s.note ? '<p class="note">'+esc(s.note)+'</p>' : '') +
          (s.location ? '<a class="loc" href="'+esc(mapLink(s.location))+'" target="_blank" rel="noopener">'+PIN+'<span>'+esc(s.location)+'</span></a>' : '') +
          filesHTML(files.filter(function(f){ return f.plan_id === s.id; })) + '</div></li>';
      }
      return '<li class="slot locked"><div class="time">'+esc(s.time_label)+'</div><div class="card"><span class="lock">'+LOCK+'</span><div><h2>Verschlossen</h2></div></div></li>';
    });
    if (choicePending && (list.length || hideLocked)) {
      list.splice(hideLocked ? list.length : list.length - 1, 0,
        '<li class="slot decide"><div class="time">Nachmittag</div><div class="card"><span class="lock">'+ICON_DICE+'</span><div><h2>Du entscheidest</h2>'+
        '<p class="note">'+(choiceOpenNow ? 'Wähl oben, wie unser Nachmittag aussieht.' : 'Das erfährst du bald.')+'</p></div></div></li>');
    }
    $('timeline').innerHTML = list.length ? list.join('') : '<li class="status">Der erste Moment kommt bald.</li>';
    Array.prototype.forEach.call(document.querySelectorAll('[data-scratch]'), function(card){
      attachScratch(card, card.getAttribute('data-scratch'));
    });
    if (newly.length) notifyNew(newly.map(function(s){ return s.title; }));
    seenOpen = openIds;
  }

  function filesHTML(list){
    if (!list.length) return '';
    return '<div class="files">' + list.map(function(f){
      return '<button type="button" class="file" data-path="'+esc(f.path)+'">'+FILE_ICON+'<span>'+esc(f.name)+'</span></button>';
    }).join('') + '</div>';
  }

  document.addEventListener('click', async function(e){
    var b = e.target.closest('button.file'); if (!b) return;
    var win = null;
    try { win = window.open('', '_blank'); } catch (err) {}
    b.disabled = true;
    var res = await sb.storage.from('attachments').createSignedUrl(b.getAttribute('data-path'), 600);
    b.disabled = false;
    if (res.error || !res.data) { if (win) win.close(); alert('Die Datei kann gerade nicht geöffnet werden.'); return; }
    if (win) win.location.href = res.data.signedUrl; else location.href = res.data.signedUrl;
  });

  var ENVELOPE = '<svg viewBox="0 0 48 36" aria-hidden="true"><rect x="1.5" y="1.5" width="45" height="33" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2 3l22 17L46 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="24" cy="21" r="4.5" fill="var(--gold)"/></svg>';
  var CAMERA = '<svg viewBox="0 0 48 40" aria-hidden="true"><rect x="2" y="9" width="44" height="29" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 9l3-6h10l3 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="24" cy="23" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="24" cy="23" r="3" fill="var(--gold)"/></svg>';
  var lastExtras = '', lastPhotoKey = '', letterWasOpen = null, albumWasOpen = null;

  function renderLetter(l){
    var box = $('letter');
    if (!l || (!l.revealed && !l.exists)) { box.hidden = true; return; }
    box.hidden = false;
    if (!l.revealed) {
      box.className = 'letter sealed';
      box.innerHTML = '<span class="seal-icon">'+ENVELOPE+'</span><div><h2>Ein Brief für dich</h2><p>Er öffnet sich am Abend.</p></div>';
      letterWasOpen = false;
      return;
    }
    box.className = 'letter open' + (letterWasOpen === false ? ' fresh' : '');
    box.innerHTML = '<h2>'+esc(l.title || 'Für dich')+'</h2><div class="letter-body">'+esc(l.body || '')+'</div><p class="letter-sign">Bejhan</p>';
    letterWasOpen = true;
  }

  async function renderAlbum(a){
    var box = $('album');
    if (!a) { box.hidden = true; return; }
    box.hidden = false;
    if (!a.revealed) {
      box.className = 'album sealed';
      box.innerHTML = '<span class="seal-icon">'+CAMERA+'</span><div><h2>'+esc(a.title || 'Unser Tag in Bildern')+'</h2><p>'+
        (a.count > 0 ? 'Schon ' + a.count + (a.count === 1 ? ' Foto' : ' Fotos') + ' gesammelt. ' : 'Heute sammeln wir hier unsere Fotos. ') +
        'Du siehst sie am Ende des Tages.</p></div>';
      albumWasOpen = false; lastPhotoKey = '';
      return;
    }
    var photos = a.photos || [];
    var pk = JSON.stringify(photos);
    if (pk === lastPhotoKey && box.classList.contains('open')) return;
    lastPhotoKey = pk;
    var urls = {};
    if (photos.length) {
      var res = await sb.storage.from('photos').createSignedUrls(photos.map(function(p){ return p.path; }), 3600);
      (res.data || []).forEach(function(r){ if (r.signedUrl) urls[r.path] = r.signedUrl; });
    }
    box.className = 'album open' + (albumWasOpen === false ? ' fresh' : '');
    box.innerHTML = '<h2>'+esc(a.title || 'Unser Tag in Bildern')+'</h2>' +
      (photos.length ? '<ul class="grid">' + photos.map(function(p){
        var u = urls[p.path]; if (!u) return '';
        return '<li><a href="'+esc(u)+'" target="_blank" rel="noopener"><img src="'+esc(u)+'" alt="'+esc(p.caption || 'Foto von unserem Tag')+'" loading="lazy"></a>'+
          (p.caption ? '<span class="cap">'+esc(p.caption)+'</span>' : '') + '</li>';
      }).join('') + '</ul>' : '<p class="muted">Noch keine Fotos.</p>');
    albumWasOpen = true;
  }

  /* ---------- Die Wahl ---------- */
  var ICON_DICE = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="5.5" cy="5.5" r="1.2" fill="currentColor"/><circle cx="10.5" cy="10.5" r="1.2" fill="currentColor"/><circle cx="8" cy="8" r="1.2" fill="currentColor"/></svg>';
  var OPT_ICONS = {
    pilatus: '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M3 40 18 14l8 12 5-7 14 21Z" fill="currentColor" opacity=".9"/><path d="M18 14l-4.6 8 3-1.4 2.2 2.2 2.4-2.6 2.7 1.2Z" fill="var(--card)"/><circle cx="37" cy="10" r="4" fill="var(--gold)"/></svg>',
    schiff:  '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 28h32l-4 8H12Z" fill="currentColor"/><path d="M14 28v-7h18v7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M22 21v-7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="22" cy="11" r="2.6" fill="var(--gold)"/><path d="M4 41c4 0 4-2.5 8-2.5s4 2.5 8 2.5 4-2.5 8-2.5 4 2.5 8 2.5 4-2.5 8-2.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".55"/></svg>',
    escape:  '<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="9" y="20" width="30" height="22" rx="4" fill="currentColor"/><path d="M15 20v-5a9 9 0 0 1 18 0v5" fill="none" stroke="currentColor" stroke-width="3.2"/><circle cx="24" cy="29" r="3.4" fill="var(--gold)"/><path d="M24 31v6" stroke="var(--gold)" stroke-width="3" stroke-linecap="round"/></svg>'
  };
  var choiceData = null, choiceKey = '', serverOffset = 0, countdownTimer = null, selected = null, choosing = false;

  function fmtOpen(iso){
    try { return new Date(iso).toLocaleString('de-CH', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) + ' Uhr'; }
    catch (e) { return ''; }
  }
  function nowServer(){ return new Date(Date.now() + serverOffset); }
  function countdownText(ms){
    var s = Math.max(0, Math.floor(ms / 1000));
    var d = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
    function p(n){ return String(n).padStart(2, '0'); }
    if (d > 0) return d + (d === 1 ? ' Tag ' : ' Tage ') + p(hh) + ':' + p(mm) + ':' + p(ss);
    return p(hh) + ':' + p(mm) + ':' + p(ss);
  }
  function optByKey(k){ return (choiceData && choiceData.options || []).find(function(o){ return o.key === k; }); }

  function imgUrl(path){ return sb.storage.from('option-images').getPublicUrl(path).data.publicUrl; }
  function hostOf(u){ try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return 'Website'; } }
  function scheduleHTML(text){
    if (!text) return '';
    var rows = text.split(/\n+/).map(function(l){ return l.trim(); }).filter(Boolean);
    if (!rows.length) return '';
    return '<ol class="sched">' + rows.map(function(l){
      var i = l.indexOf('|');
      var t = i > -1 ? l.slice(0, i).trim() : '', d = i > -1 ? l.slice(i + 1).trim() : l;
      return '<li>' + (t ? '<span class="sched-time">' + esc(t) + '</span>' : '') + '<span class="sched-what">' + esc(d) + '</span></li>';
    }).join('') + '</ol>';
  }

  function cardHTML(o, enabled, idx){
    var sel = selected === o.key, imgs = o.images || [], num = 'Option ' + (idx + 1);
    var selectBtn = enabled ? '<button type="button" class="pick-select" data-select aria-pressed="'+sel+'">'+(sel ? 'Ausgewählt' : 'Auswählen')+'</button>' : '';
    return '<li class="pick'+(sel ? ' selected' : '')+(imgs.length ? ' has-cover' : '')+'" data-key="'+esc(o.key)+'">'+
      '<div class="pick-inner">'+
        '<div class="pick-face pick-front">'+
          (imgs.length
            ? '<div class="pick-cover"><img src="'+esc(imgUrl(imgs[0]))+'" alt="" loading="lazy"><span class="pick-badge">'+(OPT_ICONS[o.key] || '')+'</span></div>'
            : '<span class="pick-icon">'+(OPT_ICONS[o.key] || '')+'</span>')+
          '<p class="pick-num">'+num+'</p>'+
          '<h3>'+esc(o.teaser)+'</h3>'+
          (o.hint ? '<p>'+esc(o.hint)+'</p>' : '')+
          '<div class="pick-actions"><button type="button" class="pick-more" data-flip>Mehr erfahren</button>'+selectBtn+'</div>'+
        '</div>'+
        '<div class="pick-face pick-back" aria-hidden="true">'+
          '<p class="pick-kicker">'+num+' · '+esc(o.teaser)+'</p>'+
          '<h3>'+esc(o.title || o.label)+'</h3>'+
          (o.details ? '<p>'+esc(o.details)+'</p>' : '')+
          scheduleHTML(o.schedule)+
          (imgs.length > 1 || (imgs.length && !o.details)
            ? '<div class="pick-gallery">' + imgs.map(function(p){ var u = imgUrl(p); return '<a href="'+esc(u)+'" target="_blank" rel="noopener"><img src="'+esc(u)+'" alt="" loading="lazy"></a>'; }).join('') + '</div>'
            : '')+
          (o.link ? '<a class="pick-link" href="'+esc(o.link)+'" target="_blank" rel="noopener">'+esc(hostOf(o.link))+' ↗</a>' : '')+
          '<div class="pick-actions"><button type="button" class="pick-more" data-flip>Zurück</button>'+selectBtn+'</div>'+
        '</div>'+
      '</div></li>';
  }

  function choiceStatus(c){
    if (!c) return 'off';
    if (c.choice) return 'chosen';
    if (!c.open_at) return 'off';
    var n = nowServer();
    if (n < new Date(c.open_at)) return 'wait';
    if (c.close_at && n >= new Date(c.close_at)) return 'closed';
    return 'open';
  }

  function renderChoice(c){
    var box = $('choice');
    clearInterval(countdownTimer);
    choicePending = false; choiceOpenNow = false;
    var status = choiceStatus(c);
    if (status === 'off') { box.hidden = true; return; }
    box.hidden = false;
    var heading = esc(c.heading || 'Wie soll unser Nachmittag aussehen?');
    var subtitle = c.subtitle ? '<p class="choice-sub">'+esc(c.subtitle)+'</p>' : '';

    if (status === 'chosen') {
      var o = optByKey(c.choice) || { teaser: c.choice, key: c.choice };
      box.className = 'choice chosen';
      box.innerHTML =
        '<p class="eyebrow">Deine Wahl</p>'+
        '<div class="ticket" id="ticket">'+
          '<span class="ticket-icon">'+(OPT_ICONS[o.key] || '')+'</span>'+
          '<div class="ticket-text"><h2 id="choiceTitle">'+esc(o.teaser)+'</h2><p>'+esc(o.title || o.label || '')+'</p></div>'+
          '<span class="stamp">Gebucht</span>'+
        '</div>'+
        (o.schedule ? '<details class="ticket-sched"><summary>Ablauf ansehen</summary>'+scheduleHTML(o.schedule)+'</details>' : '')+
        '<p class="choice-note">Die Details erfährst du am Tag selbst, Schritt für Schritt.</p>';
      return;
    }

    if (status === 'wait') {
      choicePending = true;
      box.className = 'choice is-waiting';
      var openAt = new Date(c.open_at);
      box.innerHTML = '<h2 id="choiceTitle">'+heading+'</h2>'+subtitle+
        '<p class="countdown" aria-live="off"><span class="cd-label">Die Wahl öffnet in</span><span class="cd-time" id="cdTime">'+countdownText(openAt - nowServer())+'</span></p>'+
        '<ul class="picks">'+(c.options || []).map(function(o, i){
          return '<li class="pick-mini"><span class="lock">'+LOCK+'</span><div><p class="pick-num">Option '+(i + 1)+'</p><h3>'+esc(o.teaser)+'</h3></div></li>';
        }).join('')+'</ul>';
      countdownTimer = setInterval(function(){
        var left = openAt - nowServer();
        if (left <= 0) { clearInterval(countdownTimer); choiceKey = ''; lastKey = ''; load(); return; }
        var el = $('cdTime'); if (el) el.textContent = countdownText(left);
      }, 1000);
      return;
    }

    if (status === 'closed') {
      box.className = 'choice is-closed';
      box.innerHTML = '<h2 id="choiceTitle">'+heading+'</h2>'+
        (c.text_closed ? '<p class="choice-lede">'+esc(c.text_closed)+'</p>' : '');
      return;
    }

    // offen
    choicePending = true; choiceOpenNow = true;
    var opts = c.options || [];
    var closeAt = c.close_at ? new Date(c.close_at) : null;
    box.className = 'choice is-open';
    box.innerHTML =
      '<p class="eyebrow">Eine Entscheidung</p>'+
      '<h2 id="choiceTitle">'+heading+'</h2>'+subtitle+
      (c.text_open ? '<p class="choice-lede">'+esc(c.text_open)+'</p>' : '')+
      (closeAt
        ? '<p class="deadline"><span>Wählen bis '+esc(fmtOpen(c.close_at))+'</span>'+
          '<span class="deadline-left">Noch <b id="cdLeft">'+countdownText(closeAt - nowServer())+'</b></span></p>'
        : '')+
      '<ul class="picks">'+opts.map(function(o, i){ return cardHTML(o, true, i); }).join('')+'</ul>'+
      '<div class="confirm" id="confirmBar"'+(selected ? '' : ' hidden')+'>'+
        '<p id="confirmText">'+(selected && optByKey(selected) ? 'Deine Wahl: <b>'+esc(optByKey(selected).teaser)+'</b>' : '')+'</p>'+
        '<button type="button" class="hold" id="holdBtn"><span class="hold-fill"></span><span class="hold-label">Gedrückt halten zum Bestätigen</span></button>'+
        '<p class="choice-error" id="choiceError" hidden></p>'+
      '</div>';

    if (closeAt) {
      countdownTimer = setInterval(function(){
        if (choosing) return;
        var left = closeAt - nowServer();
        if (left <= 0) { clearInterval(countdownTimer); selected = null; choiceKey = ''; lastKey = ''; load(); return; }
        var el = $('cdLeft'); if (el) el.textContent = countdownText(left);
      }, 1000);
    }
  }

  function renderBadge(c){
    var b = $('variantBadge');
    var status = choiceStatus(c);
    if (!c || status === 'wait' || status === 'open' || !c.variant) { b.hidden = true; return; }
    var o = optByKey(c.variant);
    var label = o ? (o.title || o.label) : c.variant;
    var changed = c.choice && c.variant !== c.choice;
    b.innerHTML = '<span class="badge-icon">'+(OPT_ICONS[c.variant] || '')+'</span><span>'+(changed ? 'Planänderung: ' : 'Dein Nachmittag: ')+esc(label)+'</span>';
    b.className = 'badge sunny';
    b.hidden = false;
  }


  function updateConfirm(){
    var bar = $('confirmBar'); if (!bar) return;
    bar.hidden = !selected;
    if (selected) $('confirmText').innerHTML = 'Deine Wahl: <b>'+esc(optByKey(selected).teaser)+'</b>';
    Array.prototype.forEach.call(document.querySelectorAll('.pick'), function(li){
      var on = li.getAttribute('data-key') === selected;
      li.classList.toggle('selected', on);
      Array.prototype.forEach.call(li.querySelectorAll('[data-select]'), function(btn){
        btn.setAttribute('aria-pressed', on); btn.textContent = on ? 'Ausgewählt' : 'Auswählen';
      });
    });
  }

  $('choice').addEventListener('click', function(e){
    var li = e.target.closest('.pick'); if (!li) return;
    if (e.target.closest('[data-flip]')) {
      var flipped = li.classList.toggle('flipped');
      li.querySelector('.pick-front').setAttribute('aria-hidden', flipped);
      li.querySelector('.pick-back').setAttribute('aria-hidden', !flipped);
      return;
    }
    if (e.target.closest('[data-select]') && !choosing) {
      selected = li.getAttribute('data-key');
      updateConfirm();
      try { if (navigator.vibrate) navigator.vibrate(20); } catch (err) {}
      var bar = $('confirmBar'); if (bar && bar.scrollIntoView) bar.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest' });
    }
  });

  // Gedrückt halten zum Bestätigen
  var HOLD_MS = 1300, holdStart = 0, holdRaf = 0;
  function holdProgress(p){ var b = $('holdBtn'); if (b) b.style.setProperty('--p', p); }
  function holdBegin(e){
    var b = e.target.closest && e.target.closest('#holdBtn'); if (!b || choosing || !selected) return;
    if (e.type === 'pointerdown') { try { b.setPointerCapture(e.pointerId); } catch (err) {} }
    if (e.type === 'keydown' && (e.key !== ' ' && e.key !== 'Enter' || e.repeat)) return;
    e.preventDefault();
    holdStart = performance.now();
    b.classList.add('holding');
    cancelAnimationFrame(holdRaf);
    (function tick(t){
      var p = Math.min(1, (t - holdStart) / HOLD_MS);
      holdProgress(p);
      if (p >= 1) { b.classList.remove('holding'); submitChoice(); return; }
      holdRaf = requestAnimationFrame(tick);
    })(holdStart);
  }
  function holdEnd(e){
    var b = $('holdBtn'); if (!b || choosing) return;
    if (e.type === 'keyup' && e.key !== ' ' && e.key !== 'Enter') return;
    cancelAnimationFrame(holdRaf);
    b.classList.remove('holding');
    holdProgress(0);
  }
  $('choice').addEventListener('pointerdown', holdBegin);
  $('choice').addEventListener('keydown', holdBegin);
  ['pointerup','pointercancel','pointerleave','keyup'].forEach(function(t){ $('choice').addEventListener(t, holdEnd); });
  $('choice').addEventListener('contextmenu', function(e){ if (e.target.closest('#holdBtn')) e.preventDefault(); });

  async function submitChoice(){
    if (choosing || !selected) return;
    choosing = true;
    var b = $('holdBtn'); if (b) { b.disabled = true; b.querySelector('.hold-label').textContent = 'Wird gespeichert …'; }
    var res = await sb.rpc('make_choice', { opt: selected });
    if (res.error) {
      choosing = false;
      if (b) { b.disabled = false; b.querySelector('.hold-label').textContent = 'Gedrückt halten zum Bestätigen'; }
      holdProgress(0);
      var err = $('choiceError');
      if (err) { err.textContent = (res.error.message || 'Das hat nicht geklappt.') + ' Versuch es nochmals oder sag Bejhan Bescheid.'; err.hidden = false; }
      return;
    }
    try { if (navigator.vibrate) navigator.vibrate([60, 40, 120]); } catch (err2) {}
    choiceData = res.data; choiceKey = JSON.stringify(res.data);
    renderChoice(choiceData);
    renderBadge(choiceData);
    var t = $('ticket'); if (t) t.classList.add('fresh');
    confetti();
    choosing = false; selected = null;
    lastKey = ''; load();
  }

  function confetti(){
    if (reduceMotion) return;
    var c = $('confetti'), ctx = c.getContext('2d'), dpr = window.devicePixelRatio || 1;
    var W = window.innerWidth, H = window.innerHeight;
    c.width = W * dpr; c.height = H * dpr; ctx.scale(dpr, dpr);
    c.classList.add('on');
    var cs = getComputedStyle(document.documentElement);
    var colors = [cs.getPropertyValue('--gold').trim() || '#B5822A', cs.getPropertyValue('--lake').trim() || '#24507E', '#E9C980', '#D98C8C', '#FFFFFF'];
    var parts = [];
    for (var i = 0; i < 160; i++) {
      parts.push({ x: W / 2 + (Math.random() - .5) * 80, y: H * .45, vx: (Math.random() - .5) * 13, vy: -Math.random() * 15 - 5,
        w: 5 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .35, c: colors[i % colors.length] });
    }
    var start = performance.now();
    (function frame(t){
      var el = t - start;
      ctx.clearRect(0, 0, W, H);
      parts.forEach(function(p){
        p.vy += .38; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.globalAlpha = Math.max(0, 1 - el / 3200);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (el < 3200) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, W, H); c.classList.remove('on'); }
    })(start);
  }

  var hideLocked = false;
  function renderPage(p){
    if (!p) return;
    if (!!p.hide_locked !== hideLocked) { hideLocked = !!p.hide_locked; lastKey = ''; }
    if (p.title) { $('pageTitle').textContent = p.title; document.title = p.title; }
    if (p.subtitle != null) { $('pageSubtitle').textContent = p.subtitle; $('pageSubtitle').hidden = !p.subtitle; }
    if (p.weather_date) {
      try {
        var d = new Date(p.weather_date + 'T12:00:00');
        $('eyebrow').textContent = d.toLocaleDateString('de-CH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + ' · Luzern';
      } catch (err) {}
    }
    if (p.weather_date && p.weather_date !== weatherLoadedFor) { BIRTHDAY = p.weather_date; loadWeather(); }
  }

  async function load(){
    var r = await Promise.all([sb.rpc('public_slots_v5'), sb.rpc('public_page'), sb.rpc('public_attachments'), sb.rpc('public_extras'), sb.rpc('public_choice')]);
    var slots = r[0], page = r[1], files = r[2].error ? [] : (r[2].data || []), extras = r[3], ch = r[4];
    if (!ch.error && ch.data) {
      var srv = Date.parse(ch.data.now); if (!isNaN(srv)) serverOffset = srv - Date.now();
      var ck = JSON.stringify([ch.data.open_at, ch.data.close_at, ch.data.choice, ch.data.variant, ch.data.options, ch.data.heading, ch.data.subtitle, ch.data.text_open, ch.data.text_closed, choiceStatus(ch.data)]);
      if (ck !== choiceKey && !choosing) {
        var wasPending = choicePending;
        choiceKey = ck; choiceData = ch.data;
        renderChoice(choiceData); renderBadge(choiceData);
        if (wasPending !== choicePending) lastKey = '';
      }
    }
    if (!extras.error && extras.data) {
      var ek = JSON.stringify(extras.data);
      if (ek !== lastExtras) { lastExtras = ek; renderLetter(extras.data.letter); renderAlbum(extras.data.album); }
    }
    if (!page.error) {
      var pk = JSON.stringify(page.data);
      if (pk !== lastPage) { lastPage = pk; renderPage(page.data); }
    }
    if (slots.error) {
      if (!lastKey) $('timeline').innerHTML = '<li class="status">Dein Tag kann gerade nicht geladen werden. Versuch es gleich nochmals.</li>';
      return;
    }
    var key = JSON.stringify([slots.data, files]);
    if (key === lastKey) return;
    lastKey = key;
    render(slots.data || [], files);
  }

  /* ---------- Wetter Luzern (Open-Meteo, ohne Schlüssel) ---------- */
  var SUN_SMALL = '<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></g></svg>';
  var RAIN_SMALL = '<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 15a5 5 0 1 1 1.2-9.9A6 6 0 0 1 19 9a4 4 0 0 1-1 7.9H7Z" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 19l-1 3M13 19l-1 3M17 19l-1 3"/></g></svg>';
  var ICONS = {
    sun: SUN_SMALL,
    partly: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="4" fill="var(--gold)"/><path d="M8 19a4.5 4.5 0 1 1 1.4-8.8A5.5 5.5 0 0 1 19.5 13a3.5 3.5 0 0 1-.5 6.9H8Z" fill="currentColor"/></svg>',
    cloud: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 19a5 5 0 1 1 1.2-9.9A6 6 0 0 1 19 13a3.5 3.5 0 0 1-1 6.9H7Z" fill="currentColor"/></svg>',
    fog: '<svg viewBox="0 0 24 24" aria-hidden="true"><g stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 8h18M5 12h14M3 16h18M7 20h10"/></g></svg>',
    rain: RAIN_SMALL,
    snow: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14a5 5 0 1 1 1.2-9.9A6 6 0 0 1 19 8a4 4 0 0 1-1 7.9H7Z" fill="currentColor"/><g fill="currentColor"><circle cx="8" cy="20" r="1.4"/><circle cx="12" cy="21.5" r="1.4"/><circle cx="16" cy="20" r="1.4"/></g></svg>',
    storm: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14a5 5 0 1 1 1.2-9.9A6 6 0 0 1 19 8a4 4 0 0 1-1 7.9H7Z" fill="currentColor"/><path d="M13 14l-3 5h3l-2 4" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };
  function wmo(code){
    if (code === 0) return ['Klar', 'sun'];
    if (code === 1) return ['Überwiegend sonnig', 'sun'];
    if (code === 2) return ['Teilweise bewölkt', 'partly'];
    if (code === 3) return ['Bedeckt', 'cloud'];
    if (code === 45 || code === 48) return ['Nebel', 'fog'];
    if (code >= 51 && code <= 57) return ['Nieselregen', 'rain'];
    if (code >= 61 && code <= 67) return ['Regen', 'rain'];
    if (code >= 71 && code <= 77) return ['Schnee', 'snow'];
    if (code >= 80 && code <= 82) return ['Regenschauer', 'rain'];
    if (code === 85 || code === 86) return ['Schneeschauer', 'snow'];
    if (code >= 95) return ['Gewitter', 'storm'];
    return ['Wetter', 'cloud'];
  }
  ICONS.moon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 3.5a8.5 8.5 0 1 0 5 13.6A7 7 0 0 1 15.5 3.5Z" fill="currentColor"/></svg>';
  var FIRST_HOUR = 7, LAST_HOUR = 22;

  async function loadWeather(){
    var box = $('weather');
    weatherLoadedFor = BIRTHDAY;
    var label = 'Wetter in Luzern am ' + shortDate(BIRTHDAY);
    try {
      var url = 'https://api.open-meteo.com/v1/forecast?latitude=47.05&longitude=8.31' +
        '&hourly=temperature_2m,weather_code,precipitation_probability,is_day' +
        '&daily=weather_code,temperature_2m_max,temperature_2m_min' +
        '&timezone=Europe%2FZurich&start_date=' + BIRTHDAY + '&end_date=' + BIRTHDAY;
      var res = await fetch(url);
      var d = await res.json();
      if (!res.ok || d.error || !d.hourly) {
        box.innerHTML = '<p class="w-head"><b>'+esc(label)+'</b></p>' +
          '<p class="w-wait">Die stündliche Prognose erscheint hier, sobald der Tag in Reichweite der Vorhersage ist (etwa 16 Tage vorher).</p>';
        box.hidden = false;
        return;
      }
      var day = wmo(d.daily.weather_code[0]);
      var nowHour = null;
      var n = new Date();
      var todayLocal = n.toLocaleDateString('sv-SE', { timeZone: 'Europe/Zurich' });
      if (todayLocal === BIRTHDAY) nowHour = Number(n.toLocaleString('en-GB', { timeZone: 'Europe/Zurich', hour: '2-digit', hour12: false }));
      var hours = '';
      d.hourly.time.forEach(function(t, i){
        var hr = Number(t.slice(11, 13));
        if (hr < FIRST_HOUR || hr > LAST_HOUR) return;
        var w = wmo(d.hourly.weather_code[i]);
        var icon = (!d.hourly.is_day[i] && w[1] === 'sun') ? 'moon' : w[1];
        var p = d.hourly.precipitation_probability[i];
        hours += '<li class="hour'+(hr === nowHour ? ' now' : '')+'" title="'+esc(w[0])+'">'+
          '<span class="h-time">'+(hr === nowHour ? 'Jetzt' : t.slice(11, 16))+'</span>'+
          '<span class="h-icon">'+ICONS[icon]+'</span>'+
          '<span class="h-temp">'+Math.round(d.hourly.temperature_2m[i])+'°</span>'+
          '<span class="h-rain">'+(p == null ? '' : p + '%')+'</span></li>';
      });
      box.innerHTML = '<p class="w-head"><span class="w-icon">'+ICONS[day[1]]+'</span>'+
          '<span><b>'+esc(label)+'</b><span>'+day[0]+', '+Math.round(d.daily.temperature_2m_min[0])+'° bis '+Math.round(d.daily.temperature_2m_max[0])+'°</span></span></p>'+
        '<ol class="hours" aria-label="Stündliche Prognose">'+hours+'</ol>'+
        '<p class="w-note">Prozent = Regenwahrscheinlichkeit</p>';
      box.hidden = false;
      var cur = box.querySelector('.hour.now');
      if (cur) cur.parentNode.scrollLeft = cur.offsetLeft - 16;
    } catch (e) {
      box.hidden = true;
    }
  }

  load();
  setTimeout(function(){ if (!weatherLoadedFor) loadWeather(); }, 3000);
  setInterval(load, 20000);
  setInterval(function(){ lastExtras = ''; lastPhotoKey = ''; }, 50 * 60 * 1000);
  setInterval(loadWeather, 15 * 60 * 1000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) load(); });
})();
</script>
</body>
</html>
