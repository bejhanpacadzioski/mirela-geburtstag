<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Alles Gute, Mirela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=12">
</head>
<body>
<main class="wrap">
  <header>
    <p class="eyebrow" id="eyebrow">Freitag, 27. November 2026 · Luzern</p>
    <h1 id="pageTitle">Alles Gute, Mirela</h1>
    <p class="lede" id="pageSubtitle">Heute gehört dir. Was wir vorhaben, erfährst du erst, wenn es so weit ist.</p>
    <div class="infobar"><span class="badge" id="variantBadge" hidden></span></div>
    <section class="weather" id="weather" hidden></section>
    <div class="progress"><div class="bar"><span id="bar"></span></div><span id="count"></span></div>
  </header>
  <ol class="timeline" id="timeline"><li class="status">Dein Tag wird geladen …</li></ol>
  <section class="letter" id="letter" hidden></section>
  <section class="album" id="album" hidden></section>
  <p class="sign">Von Bejhan, mit Liebe.</p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=12"></script>
<script>
(function(){
  var sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  var BIRTHDAY = '2026-11-27', weatherLoadedFor = null;
  function shortDate(iso){ var a = iso.split('-'); return Number(a[2]) + '.' + Number(a[1]) + '.'; }
  var FILE_ICON = '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5h5l3.5 3.5v9.5h-8.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 1.5V5h3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
  var LOCK = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="currentColor"/><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
  var PIN = '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a4.5 4.5 0 0 0-4.5 4.5c0 3.4 4.5 8.5 4.5 8.5s4.5-5.1 4.5-8.5A4.5 4.5 0 0 0 8 1.5Zm0 6.2a1.7 1.7 0 1 1 0-3.4 1.7 1.7 0 0 1 0 3.4Z" fill="currentColor"/></svg>';
  var lastKey = '', lastPage = '', seenOpen = null;

  function $(id){ return document.getElementById(id); }
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function mapLink(q){ return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q); }

  /* ---------- Programm ---------- */
  /* ---------- Freirubbeln & Benachrichtigung ---------- */
  var SCRATCH_KEY = 'mirela-scratched';
  function getScratched(){ try { return JSON.parse(localStorage.getItem(SCRATCH_KEY) || '[]'); } catch (e) { return []; } }
  function markScratched(id){
    var s = getScratched(); if (s.indexOf(id) === -1) s.push(id);
    try { localStorage.setItem(SCRATCH_KEY, JSON.stringify(s)); } catch (e) {}
  }
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function attachScratch(card, id){
    var c = document.createElement('canvas');
    c.className = 'scratch';
    c.setAttribute('aria-hidden', 'true');
    var skip = document.createElement('button');
    skip.type = 'button'; skip.className = 'scratch-skip'; skip.textContent = 'Aufdecken';
    card.appendChild(c); card.appendChild(skip); card.classList.add('is-covered');
    var r = card.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    c.width = Math.max(1, Math.round(r.width * dpr)); c.height = Math.max(1, Math.round(r.height * dpr));
    var ctx = c.getContext('2d');
    ctx.scale(dpr, dpr);
    var cs = getComputedStyle(document.documentElement);
    var g = ctx.createLinearGradient(0, 0, r.width, r.height);
    g.addColorStop(0, '#E9C980'); g.addColorStop(.5, '#C99A3E'); g.addColorStop(1, '#E3BE6E');
    ctx.fillStyle = g; ctx.fillRect(0, 0, r.width, r.height);
    for (var i = 0; i < 260; i++) {
      ctx.fillStyle = 'rgba(255,255,255,' + (Math.random() * .18) + ')';
      ctx.fillRect(Math.random() * r.width, Math.random() * r.height, 1.5, 1.5);
    }
    ctx.fillStyle = 'rgba(40,28,8,.78)';
    ctx.font = '400 21px ' + (cs.getPropertyValue('--display') || 'Georgia, serif');
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Freirubbeln', r.width / 2, r.height / 2 - 9);
    ctx.font = '500 13px ' + (cs.getPropertyValue('--body') || 'system-ui, sans-serif');
    ctx.fillText('mit dem Finger über die Karte wischen', r.width / 2, r.height / 2 + 15);
    ctx.globalCompositeOperation = 'destination-out';

    var down = false, last = null, moves = 0, done = false;
    function reveal(){
      if (done) return; done = true;
      markScratched(id);
      card.classList.remove('is-covered');
      c.classList.add('gone'); skip.remove();
      setTimeout(function(){ c.remove(); }, reduceMotion ? 0 : 500);
    }
    function pt(e){ var b = c.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; }
    function scratch(p){
      ctx.lineWidth = 46; ctx.lineCap = 'round';
      ctx.beginPath();
      if (last) { ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); }
      ctx.arc(p.x, p.y, 23, 0, Math.PI * 2); ctx.fill();
      last = p;
      if (++moves % 12 === 0) check();
    }
    function check(){
      var d = ctx.getImageData(0, 0, c.width, c.height).data, clear = 0, total = 0;
      for (var i = 3; i < d.length; i += 4 * 40) { total++; if (d[i] < 40) clear++; }
      if (total && clear / total > .5) reveal();
    }
    c.addEventListener('pointerdown', function(e){ down = true; last = null; c.setPointerCapture(e.pointerId); scratch(pt(e)); });
    c.addEventListener('pointermove', function(e){ if (down) scratch(pt(e)); });
    c.addEventListener('pointerup', function(){ down = false; last = null; check(); });
    c.addEventListener('pointercancel', function(){ down = false; last = null; });
    skip.addEventListener('click', reveal);
  }

  var toastTimer = null;
  function notifyNew(titles){
    try { if (navigator.vibrate) navigator.vibrate([140, 90, 140]); } catch (e) {}
    var t = $('toast');
    t.textContent = titles.length === 1 ? 'Neu freigeschaltet: ' + titles[0] : titles.length + ' neue Momente freigeschaltet';
    t.hidden = false;
    requestAnimationFrame(function(){ t.classList.add('show'); });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ t.hidden = true; }, 400); }, 5000);
  }

  function render(slots, files){
    files = files || [];
    var open = slots.filter(function(s){return s.revealed});
    var openIds = open.map(function(s){return s.id});
    var scratched = getScratched();
    var newly = seenOpen ? open.filter(function(s){ return seenOpen.indexOf(s.id) === -1; }) : [];
    $('bar').style.width = (slots.length ? Math.round(open.length/slots.length*100) : 0) + '%';
    $('count').textContent = open.length + ' von ' + slots.length + ' Momenten enthüllt';
    $('timeline').innerHTML = slots.map(function(s){
      if (s.revealed) {
        var fresh = seenOpen && seenOpen.indexOf(s.id) === -1 ? ' fresh' : '';
        var cover = scratched.indexOf(s.id) === -1 ? ' data-scratch="'+esc(s.id)+'"' : '';
        return '<li class="slot open'+fresh+'"><div class="time">'+esc(s.time_label)+'</div><div class="card"'+cover+'><h2>'+esc(s.title)+'</h2>'+
          (s.place ? '<p class="place">'+esc(s.place)+'</p>' : '') + (s.note ? '<p class="note">'+esc(s.note)+'</p>' : '') +
          (s.location ? '<a class="loc" href="'+esc(mapLink(s.location))+'" target="_blank" rel="noopener">'+PIN+'<span>'+esc(s.location)+'</span></a>' : '') +
          filesHTML(files.filter(function(f){ return f.plan_id === s.id; })) + '</div></li>';
      }
      return '<li class="slot locked"><div class="time">'+esc(s.time_label)+'</div><div class="card"><span class="lock">'+LOCK+'</span><div><h2>Überraschung</h2></div></div></li>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('[data-scratch]'), function(card){
      attachScratch(card, card.getAttribute('data-scratch'));
    });
    if (newly.length) notifyNew(newly.map(function(s){ return s.title; }));
    seenOpen = openIds;
  }

  function filesHTML(list){
    if (!list.length) return '';
    return '<div class="files">' + list.map(function(f){
      return '<button type="button" class="file" data-path="'+esc(f.path)+'">'+FILE_ICON+'<span>'+esc(f.name)+'</span></button>';
    }).join('') + '</div>';
  }

  document.addEventListener('click', async function(e){
    var b = e.target.closest('button.file'); if (!b) return;
    var win = null;
    try { win = window.open('', '_blank'); } catch (err) {}
    b.disabled = true;
    var res = await sb.storage.from('attachments').createSignedUrl(b.getAttribute('data-path'), 600);
    b.disabled = false;
    if (res.error || !res.data) { if (win) win.close(); alert('Die Datei kann gerade nicht geöffnet werden.'); return; }
    if (win) win.location.href = res.data.signedUrl; else location.href = res.data.signedUrl;
  });

  var ENVELOPE = '<svg viewBox="0 0 48 36" aria-hidden="true"><rect x="1.5" y="1.5" width="45" height="33" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2 3l22 17L46 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="24" cy="21" r="4.5" fill="var(--gold)"/></svg>';
  var CAMERA = '<svg viewBox="0 0 48 40" aria-hidden="true"><rect x="2" y="9" width="44" height="29" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 9l3-6h10l3 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="24" cy="23" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="24" cy="23" r="3" fill="var(--gold)"/></svg>';
  var lastExtras = '', lastPhotoKey = '', letterWasOpen = null, albumWasOpen = null;

  function renderLetter(l){
    var box = $('letter');
    if (!l || (!l.revealed && !l.exists)) { box.hidden = true; return; }
    box.hidden = false;
    if (!l.revealed) {
      box.className = 'letter sealed';
      box.innerHTML = '<span class="seal-icon">'+ENVELOPE+'</span><div><h2>Ein Brief für dich</h2><p>Er öffnet sich am Abend.</p></div>';
      letterWasOpen = false;
      return;
    }
    box.className = 'letter open' + (letterWasOpen === false ? ' fresh' : '');
    box.innerHTML = '<h2>'+esc(l.title || 'Für dich')+'</h2><div class="letter-body">'+esc(l.body || '')+'</div><p class="letter-sign">Bejhan</p>';
    letterWasOpen = true;
  }

  async function renderAlbum(a){
    var box = $('album');
    if (!a) { box.hidden = true; return; }
    box.hidden = false;
    if (!a.revealed) {
      box.className = 'album sealed';
      box.innerHTML = '<span class="seal-icon">'+CAMERA+'</span><div><h2>'+esc(a.title || 'Unser Tag in Bildern')+'</h2><p>'+
        (a.count > 0 ? 'Schon ' + a.count + (a.count === 1 ? ' Foto' : ' Fotos') + ' gesammelt. ' : 'Heute sammeln wir hier unsere Fotos. ') +
        'Du siehst sie am Ende des Tages.</p></div>';
      albumWasOpen = false; lastPhotoKey = '';
      return;
    }
    var photos = a.photos || [];
    var pk = JSON.stringify(photos);
    if (pk === lastPhotoKey && box.classList.contains('open')) return;
    lastPhotoKey = pk;
    var urls = {};
    if (photos.length) {
      var res = await sb.storage.from('photos').createSignedUrls(photos.map(function(p){ return p.path; }), 3600);
      (res.data || []).forEach(function(r){ if (r.signedUrl) urls[r.path] = r.signedUrl; });
    }
    box.className = 'album open' + (albumWasOpen === false ? ' fresh' : '');
    box.innerHTML = '<h2>'+esc(a.title || 'Unser Tag in Bildern')+'</h2>' +
      (photos.length ? '<ul class="grid">' + photos.map(function(p){
        var u = urls[p.path]; if (!u) return '';
        return '<li><a href="'+esc(u)+'" target="_blank" rel="noopener"><img src="'+esc(u)+'" alt="'+esc(p.caption || 'Foto von unserem Tag')+'" loading="lazy"></a>'+
          (p.caption ? '<span class="cap">'+esc(p.caption)+'</span>' : '') + '</li>';
      }).join('') + '</ul>' : '<p class="muted">Noch keine Fotos.</p>');
    albumWasOpen = true;
  }

  function renderPage(p){
    if (!p) return;
    if (p.title) { $('pageTitle').textContent = p.title; document.title = p.title; }
    if (p.subtitle != null) { $('pageSubtitle').textContent = p.subtitle; $('pageSubtitle').hidden = !p.subtitle; }
    var b = $('variantBadge');
    if (p.variant === 'gut') { b.innerHTML = SUN_SMALL + '<span>Schönwetter-Programm</span>'; b.className = 'badge sunny'; b.hidden = false; }
    else if (p.variant === 'schlecht') { b.innerHTML = RAIN_SMALL + '<span>Schlechtwetter-Programm</span>'; b.className = 'badge rainy'; b.hidden = false; }
    else b.hidden = true;
    if (p.weather_date) {
      try {
        var d = new Date(p.weather_date + 'T12:00:00');
        $('eyebrow').textContent = d.toLocaleDateString('de-CH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + ' · Luzern';
      } catch (err) {}
    }
    if (p.weather_date && p.weather_date !== weatherLoadedFor) { BIRTHDAY = p.weather_date; loadWeather(); }
  }

  async function load(){
    var r = await Promise.all([sb.rpc('public_slots_v3'), sb.rpc('public_page'), sb.rpc('public_attachments'), sb.rpc('public_extras')]);
    var slots = r[0], page = r[1], files = r[2].error ? [] : (r[2].data || []), extras = r[3];
    if (!extras.error && extras.data) {
      var ek = JSON.stringify(extras.data);
      if (ek !== lastExtras) { lastExtras = ek; renderLetter(extras.data.letter); renderAlbum(extras.data.album); }
    }
    if (!page.error) {
      var pk = JSON.stringify(page.data);
      if (pk !== lastPage) { lastPage = pk; renderPage(page.data); }
    }
    if (slots.error) {
      if (!lastKey) $('timeline').innerHTML = '<li class="status">Dein Tag kann gerade nicht geladen werden. Versuch es gleich nochmals.</li>';
      return;
    }
    var key = JSON.stringify([slots.data, files]);
    if (key === lastKey) return;
    lastKey = key;
    render(slots.data || [], files);
  }

  /* ---------- Wetter Luzern (Open-Meteo, ohne Schlüssel) ---------- */
  var SUN_SMALL = '<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></g></svg>';
  var RAIN_SMALL = '<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 15a5 5 0 1 1 1.2-9.9A6 6 0 0 1 19 9a4 4 0 0 1-1 7.9H7Z" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 19l-1 3M13 19l-1 3M17 19l-1 3"/></g></svg>';
  var ICONS = {
    sun: SUN_SMALL,
    partly: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="4" fill="var(--gold)"/><path d="M8 19a4.5 4.5 0 1 1 1.4-8.8A5.5 5.5 0 0 1 19.5 13a3.5 3.5 0 0 1-.5 6.9H8Z" fill="currentColor"/></svg>',
    cloud: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 19a5 5 0 1 1 1.2-9.9A6 6 0 0 1 19 13a3.5 3.5 0 0 1-1 6.9H7Z" fill="currentColor"/></svg>',
    fog: '<svg viewBox="0 0 24 24" aria-hidden="true"><g stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 8h18M5 12h14M3 16h18M7 20h10"/></g></svg>',
    rain: RAIN_SMALL,
    snow: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14a5 5 0 1 1 1.2-9.9A6 6 0 0 1 19 8a4 4 0 0 1-1 7.9H7Z" fill="currentColor"/><g fill="currentColor"><circle cx="8" cy="20" r="1.4"/><circle cx="12" cy="21.5" r="1.4"/><circle cx="16" cy="20" r="1.4"/></g></svg>',
    storm: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14a5 5 0 1 1 1.2-9.9A6 6 0 0 1 19 8a4 4 0 0 1-1 7.9H7Z" fill="currentColor"/><path d="M13 14l-3 5h3l-2 4" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };
  function wmo(code){
    if (code === 0) return ['Klar', 'sun'];
    if (code === 1) return ['Überwiegend sonnig', 'sun'];
    if (code === 2) return ['Teilweise bewölkt', 'partly'];
    if (code === 3) return ['Bedeckt', 'cloud'];
    if (code === 45 || code === 48) return ['Nebel', 'fog'];
    if (code >= 51 && code <= 57) return ['Nieselregen', 'rain'];
    if (code >= 61 && code <= 67) return ['Regen', 'rain'];
    if (code >= 71 && code <= 77) return ['Schnee', 'snow'];
    if (code >= 80 && code <= 82) return ['Regenschauer', 'rain'];
    if (code === 85 || code === 86) return ['Schneeschauer', 'snow'];
    if (code >= 95) return ['Gewitter', 'storm'];
    return ['Wetter', 'cloud'];
  }
  ICONS.moon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 3.5a8.5 8.5 0 1 0 5 13.6A7 7 0 0 1 15.5 3.5Z" fill="currentColor"/></svg>';
  var FIRST_HOUR = 7, LAST_HOUR = 22;

  async function loadWeather(){
    var box = $('weather');
    weatherLoadedFor = BIRTHDAY;
    var label = 'Wetter in Luzern am ' + shortDate(BIRTHDAY);
    try {
      var url = 'https://api.open-meteo.com/v1/forecast?latitude=47.05&longitude=8.31' +
        '&hourly=temperature_2m,weather_code,precipitation_probability,is_day' +
        '&daily=weather_code,temperature_2m_max,temperature_2m_min' +
        '&timezone=Europe%2FZurich&start_date=' + BIRTHDAY + '&end_date=' + BIRTHDAY;
      var res = await fetch(url);
      var d = await res.json();
      if (!res.ok || d.error || !d.hourly) {
        box.innerHTML = '<p class="w-head"><b>'+esc(label)+'</b></p>' +
          '<p class="w-wait">Die stündliche Prognose erscheint hier, sobald der Tag in Reichweite der Vorhersage ist (etwa 16 Tage vorher).</p>';
        box.hidden = false;
        return;
      }
      var day = wmo(d.daily.weather_code[0]);
      var nowHour = null;
      var n = new Date();
      var todayLocal = n.toLocaleDateString('sv-SE', { timeZone: 'Europe/Zurich' });
      if (todayLocal === BIRTHDAY) nowHour = Number(n.toLocaleString('en-GB', { timeZone: 'Europe/Zurich', hour: '2-digit', hour12: false }));
      var hours = '';
      d.hourly.time.forEach(function(t, i){
        var hr = Number(t.slice(11, 13));
        if (hr < FIRST_HOUR || hr > LAST_HOUR) return;
        var w = wmo(d.hourly.weather_code[i]);
        var icon = (!d.hourly.is_day[i] && w[1] === 'sun') ? 'moon' : w[1];
        var p = d.hourly.precipitation_probability[i];
        hours += '<li class="hour'+(hr === nowHour ? ' now' : '')+'" title="'+esc(w[0])+'">'+
          '<span class="h-time">'+(hr === nowHour ? 'Jetzt' : t.slice(11, 16))+'</span>'+
          '<span class="h-icon">'+ICONS[icon]+'</span>'+
          '<span class="h-temp">'+Math.round(d.hourly.temperature_2m[i])+'°</span>'+
          '<span class="h-rain">'+(p == null ? '' : p + '%')+'</span></li>';
      });
      box.innerHTML = '<p class="w-head"><span class="w-icon">'+ICONS[day[1]]+'</span>'+
          '<span><b>'+esc(label)+'</b><span>'+day[0]+', '+Math.round(d.daily.temperature_2m_min[0])+'° bis '+Math.round(d.daily.temperature_2m_max[0])+'°</span></span></p>'+
        '<ol class="hours" aria-label="Stündliche Prognose">'+hours+'</ol>'+
        '<p class="w-note">Prozent = Regenwahrscheinlichkeit</p>';
      box.hidden = false;
      var cur = box.querySelector('.hour.now');
      if (cur) cur.parentNode.scrollLeft = cur.offsetLeft - 16;
    } catch (e) {
      box.hidden = true;
    }
  }

  load();
  setTimeout(function(){ if (!weatherLoadedFor) loadWeather(); }, 3000);
  setInterval(load, 20000);
  setInterval(function(){ lastExtras = ''; lastPhotoKey = ''; }, 50 * 60 * 1000);
  setInterval(loadWeather, 15 * 60 * 1000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) load(); });
})();
</script>
</body>
</html>
